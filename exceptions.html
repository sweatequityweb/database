<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exceptions & Safety — Ugnayan Gulayan</title>
<script>try{var t=localStorage.getItem('ug-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--bg:#f2f7f1;--surface:#ffffff;--text:#13241a;--muted:#5d7064;--border:#dfe9dd;--accent:#15803d;--accent2:#65a30d;--info:#2563eb;--ok:#15803d;--warn:#c2740a;--danger:#dc2626;
--shadow:0 1px 2px rgba(19,36,26,.05),0 8px 24px rgba(21,128,61,.08);--shadow-lg:0 4px 8px rgba(19,36,26,.06),0 16px 36px rgba(21,128,61,.14);
--ok-bg:#ecfdf3;--warn-bg:#fff7e6;--danger-bg:#fef0f0;--accent-bg:#eaf7ee;--info-bg:#eaf1ff;--soft:#f6faf5;
--grad:linear-gradient(135deg,#15803d 0%,#4d9f1f 55%,#a3c928 100%);--radius:16px;
--page:radial-gradient(900px 420px at 8% -8%,rgba(101,163,13,.16),transparent 60%),radial-gradient(800px 380px at 100% 0%,rgba(21,128,61,.12),transparent 60%)}
[data-theme="dark"]{--bg:#0b120e;--surface:#131d17;--text:#e7f1ea;--muted:#9bb0a2;--border:#223229;--accent:#4ade80;--accent2:#a3e635;--info:#7db3ff;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;
--ok-bg:#10281a;--warn-bg:#33270b;--danger-bg:#331616;--accent-bg:#14291c;--info-bg:#15233d;--soft:#18251d;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 4px 8px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.5);
--grad:linear-gradient(135deg,#166534 0%,#3f7d20 55%,#7a9a1a 100%);
--page:radial-gradient(900px 420px at 8% -8%,rgba(74,222,128,.10),transparent 60%),radial-gradient(800px 380px at 100% 0%,rgba(163,230,53,.07),transparent 60%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page),var(--bg);background-attachment:fixed;color:var(--text);font:14.5px/1.55 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
a{color:var(--accent)}
::selection{background:var(--accent);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.topbar{position:sticky;top:0;z-index:50;background:var(--grad);box-shadow:0 4px 18px rgba(21,128,61,.28);border-bottom:1px solid rgba(255,255,255,.15)}
.tb-in{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.tb-link{text-decoration:none;font-weight:700;white-space:nowrap;color:#fff;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:99px;transition:background .2s,transform .2s}
.tb-link:hover{background:rgba(255,255,255,.28);transform:translateX(-2px)}
.tb-title{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font-size:16px;letter-spacing:.01em}
.tb-title::before{content:"\1F331";margin-right:8px}
.tb-right{display:flex;align-items:center;gap:8px}
.chip{font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(6px)}
.topbar .btn{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
.topbar .btn:hover{background:rgba(255,255,255,.3);border-color:#fff}
.btn{font:inherit;font-size:13px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 14px;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s,background .2s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(21,128,61,.3)}
.btn.primary:hover{box-shadow:0 8px 22px rgba(21,128,61,.42)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 48px;animation:rise .5s ease both}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.muted{color:var(--muted)}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-left:5px solid var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:700}
.banner small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;overflow:hidden;transition:box-shadow .25s,transform .25s}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--grad)}
.card:hover{box-shadow:var(--shadow-lg)}
.card h2{font-size:12px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:linear-gradient(180deg,var(--soft),var(--surface));border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .5s ease both}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}.stat:nth-child(4){animation-delay:.15s}.stat:nth-child(5){animation-delay:.2s}
.stat .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat.ok .v{color:var(--ok)}.stat.warn .v{color:var(--warn)}.stat.danger .v{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 11px;border:1px solid var(--border);background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.badge.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.badge.danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.badge.info{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.bar-row{margin:12px 0}
.bar-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
.bar{height:11px;background:var(--border);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4,#3b82f6);background-size:200% 100%;border-radius:99px;animation:shimmer 4s linear infinite;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.ok span{background:linear-gradient(90deg,#15803d,#84cc16,#15803d);background-size:200% 100%}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
input[type=search],input[type=text]{font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:11px 16px;width:100%;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(21,128,61,.18)}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;animation:rise .5s ease both}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--soft);padding:12px 14px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr{transition:background .15s}
tbody tr:nth-child(even){background:rgba(21,128,61,.025)}
tbody tr:hover{background:var(--accent-bg)}
tbody tr:last-child td{border-bottom:0}
tr.hl-warn,tr.hl-warn:nth-child(even){background:var(--warn-bg)}tr.hl-ok,tr.hl-ok:nth-child(even){background:var(--ok-bg)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--danger);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.section-title{font-size:16px;font-weight:800;margin:26px 0 10px;padding-left:12px;border-left:4px solid var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tile{position:relative;display:block;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px 20px;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;animation:rise .55s ease both}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}.tile:nth-child(6){animation-delay:.25s}
.tile::before{content:"\1F33F";display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:var(--accent-bg);font-size:24px;margin-bottom:14px;transition:transform .3s}
.tile[href="attendance.html"]::before{content:"\1F331"}
.tile[href="sweat-equity.html"]::before{content:"\1F4AA"}
.tile[href="exceptions.html"]::before{content:"\1F6E1\FE0F"}
.tile[href="farm.html"]::before{content:"\1F955"}
.tile[href="tools.html"]::before{content:"\1F6E0\FE0F"}
.tile[href="fund.html"]::before{content:"\1F4B0"}
.tile::after{content:"\2192";position:absolute;right:18px;top:20px;font-size:18px;font-weight:700;color:var(--accent);opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .25s}
.tile:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.tile:hover::before{transform:scale(1.12) rotate(-6deg)}
.tile:hover::after{opacity:1;transform:none}
.tile b{display:block;font-size:16px;font-weight:800;margin-bottom:2px}.tile span{color:var(--muted);font-size:13px}
.people{max-height:50vh;overflow-y:auto;margin-top:12px;padding-right:4px}
.person{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s}
.person:hover{border-color:var(--accent);background:var(--accent-bg);transform:translateX(4px);box-shadow:var(--shadow)}
.login{max-width:560px;margin:32px auto}
.login h1{font-size:30px}
.login::before{height:6px}
@media (max-width:600px){
  h1{font-size:24px}
  .tb-link{font-size:13px}
  table,tbody{display:block;width:100%}
  thead{display:none}
  .table-wrap{background:none;border:0;box-shadow:none}
  tbody tr,tbody tr:nth-child(even){display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  tbody td{display:block;border:0;padding:0}
  tbody td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
  tbody td.c-wide{grid-column:1 / -1}
  tbody tr.hl-warn{background:var(--warn-bg)}tbody tr.hl-ok{background:var(--ok-bg)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="app">
<h1 id="h1">Exceptions & Safety</h1><div id="banner"></div><div id="mycard"></div><div id="content"><p class="muted">Loading…</p></div>
</main>
<script>
var SESSION_KEY='ug-current-user';
var CDN=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
var STAFF_ROLES=['committee','liaison','coordinator','documentation','treasurer','logistics','shift_lead'];
var MEMBER_ROLES=['parent','student'];
var ROLE_LABELS={committee:'Committee',liaison:'Farm Liaison',coordinator:'Coordinator',documentation:'Documentation',treasurer:'Treasurer',logistics:'Logistics',shift_lead:'Shift Lead',parent:'Parent',student:'Student'};
var WARN_BANNER='Data could not be loaded. Showing offline fallback. Please check the Excel file.';

/* ---- small utilities ---- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function norm(s){return String(s==null?'':s).trim().toLowerCase();}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;}
function fmt(n,d){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d==null?1:d});}
function peso(n){return (n<0?'-':'')+'\u20B1'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function g(o,h){var v=o[norm(h)];return v==null?'':v;}
function sGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function sSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function sDel(k){try{sessionStorage.removeItem(k);}catch(e){}}
function normRole(s){var r=norm(s).replace(/[\s\-]+/g,'_');return(STAFF_ROLES.indexOf(r)>-1||MEMBER_ROLES.indexOf(r)>-1)?r:'parent';}
function matches(o,q){q=norm(q);if(!q)return true;return Object.keys(o).some(function(k){var v=o[k];return(typeof v==='string'||typeof v==='number')&&String(v).toLowerCase().indexOf(q)>-1;});}

/* ---- Excel dates ---- */
function ymd(d){var m=d.getUTCMonth()+1,day=d.getUTCDate();return d.getUTCFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;}
function excelDate(v){
  if(v===''||v==null)return '';
  if(v instanceof Date)return ymd(v);
  if(typeof v==='number'){return(v>20000&&v<80000)?ymd(new Date(Math.round((v-25569)*86400000))):String(v);}
  var s=String(v).trim();
  if(/^\d{5}(\.\d+)?$/.test(s))return excelDate(parseFloat(s));
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  return s;
}
function daysBetween(a,b){
  var re=/^(\d{4})-(\d{2})-(\d{2})$/,x=re.exec(a||''),y=re.exec(b||'');
  if(!x||!y)return null;
  return Math.round((Date.UTC(+y[1],y[2]-1,+y[3])-Date.UTC(+x[1],x[2]-1,+x[3]))/86400000);
}

/* ---- SheetJS loading + Excel fetching ---- */
var _xlsxP=null;
function loadSheetJS(){
  if(window.XLSX)return Promise.resolve();
  if(_xlsxP)return _xlsxP;
  _xlsxP=new Promise(function(res,rej){
    var i=0;
    (function next(){
      if(i>=CDN.length){rej(new Error('SheetJS library could not be loaded'));return;}
      var s=document.createElement('script'),done=false;
      function fail(){if(done)return;done=true;s.remove();next();}
      s.async=true;s.src=CDN[i++];
      s.onload=function(){if(done)return;done=true;window.XLSX?res():next();};
      s.onerror=fail;setTimeout(fail,8000);
      document.head.appendChild(s);
    })();
  });
  return _xlsxP;
}
function withTimeout(p,ms,msg){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function fetchExcel(fileName){
  var p=Promise.all([loadSheetJS(),fetch('data/'+fileName+'?t='+Date.now(),{cache:'no-store'})]).then(function(r){
    if(!r[1].ok)throw new Error('data/'+fileName+' returned HTTP '+r[1].status);
    return r[1].arrayBuffer();
  }).then(function(buf){return XLSX.read(buf,{type:'array'});});
  return withTimeout(p,20000,'data/'+fileName+' timed out');
}
/* Finds the sheet by name, finds the header row within the first 10 rows, returns objects keyed by lower-case header. */
function readSheet(wb,names,headers,strict){
  var low=wb.SheetNames.map(norm),sn=null,i;
  for(i=0;i<names.length&&sn===null;i++){var k=low.indexOf(norm(names[i]));if(k>-1)sn=wb.SheetNames[k];}
  if(sn===null){if(strict)return[];sn=wb.SheetNames[0];}
  var aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  var want=headers.map(norm),best=-1,bs=0,r;
  for(r=0;r<Math.min(10,aoa.length);r++){var sc=0;aoa[r].forEach(function(c){if(want.indexOf(norm(c))>-1)sc++;});if(sc>bs){bs=sc;best=r;}}
  if(best<0||bs<2)throw new Error('Header row not found in sheet "'+sn+'"');
  var keys=aoa[best].map(norm),out=[];
  for(r=best+1;r<aoa.length;r++){
    var o={},any=false;
    keys.forEach(function(k,c){
      if(!k)return;
      var v=aoa[r][c];if(v==null)v='';
      if(typeof v==='string')v=v.trim();
      if(v!=='')any=true;
      if(k.indexOf('date')>-1||k.indexOf('checked')>-1)v=excelDate(v);
      o[k]=v;
    });
    if(any)out.push(o);
  }
  return out;
}

/* ---- session + role access ---- */
function getUser(){var s=sGet(SESSION_KEY);if(!s)return null;try{var u=JSON.parse(s);if(!u||!u.name)return null;u.roleKey=normRole(u.roleKey||u.role);return u;}catch(e){return null;}}
function isStaff(u){return !!u&&STAFF_ROLES.indexOf(u.roleKey)>-1;}
function roleLabel(r){return ROLE_LABELS[r]||r;}
function signOut(){sDel(SESSION_KEY);location.href='index.html';}

/* ---- page chrome ---- */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ug-theme',t);}catch(e){}}
function setupTopbar(title,hub){
  var u=getUser(),el=document.getElementById('topbar');
  el.innerHTML='<div class="tb-in">'+(hub?'':'<a class="tb-link" href="index.html">\u2190 Hub</a>')+'<div class="tb-title">'+esc(title)+'</div><div class="tb-right">'+
    (u?'<span class="chip" title="'+esc(roleLabel(u.roleKey))+'">'+esc(u.name)+'</span>':'')+
    '<button class="btn" id="themeBtn" type="button" aria-label="Toggle dark mode">\u25D0</button>'+
    (u?'<button class="btn" id="outBtn" type="button">Sign out</button>':'')+'</div></div>';
  document.getElementById('themeBtn').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};
  var o=document.getElementById('outBtn');if(o)o.onclick=signOut;
}
function initPage(opts){
  setupTopbar(opts.title,false);
  var u=getUser(),app=document.getElementById('app');
  if(!u){app.innerHTML='<div class="card login"><h1>Please sign in</h1><p class="muted">You need to choose your name on the hub page before viewing this module.</p><a class="btn primary" href="index.html" style="text-decoration:none;display:inline-block">Go to sign in</a></div>';return null;}
  if(opts.staffOnly&&!isStaff(u)){app.innerHTML='<div class="card login"><h1>Not available</h1><p class="muted">This module is only available to program staff. Parents and students can use Farm Points and Sweat Equity.</p><a class="btn primary" href="index.html" style="text-decoration:none;display:inline-block">Back to hub</a></div>';return null;}
  return u;
}
function showBanner(err){
  var b=document.getElementById('banner');if(!b)return;
  b.innerHTML='<div class="banner">\u26A0 '+esc(WARN_BANNER)+(err&&err.message?'<small>'+esc(err.message)+'</small>':'')+'</div>';
}

/* ---- reusable HTML builders ---- */
function stat(label,value,sub,cls){return '<div class="stat '+(cls||'')+'"><div class="l">'+esc(label)+'</div><div class="v">'+esc(value)+'</div>'+(sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div>';}
function statsRow(a){return '<div class="stats">'+a.join('')+'</div>';}
function badge(text,cls){return '<span class="badge '+(cls||'')+'">'+esc(text)+'</span>';}
function bar(label,val,max,ok){var p=max?Math.max(0,Math.min(val/max*100,100)):0;return '<div class="bar-row"><div class="bar-top"><span>'+esc(label)+'</span><span class="num">'+fmt(val)+' / '+fmt(max)+'</span></div><div class="bar'+(ok?' ok':'')+'"><span style="width:'+p.toFixed(1)+'%"></span></div></div>';}
/* cols: [{h:'Label', f:function(row){return html}, wide:true}] */
function tableHTML(cols,rows,rowClass){
  if(!rows.length)return '<div class="empty">No records to show.</div>';
  var h='<div class="table-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c.h)+'</th>';}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    var rc=rowClass?rowClass(r):'';
    h+='<tr'+(rc?' class="'+rc+'"':'')+'>'+cols.map(function(c){return '<td data-label="'+esc(c.h)+'"'+(c.wide?' class="c-wide"':'')+'>'+c.f(r)+'</td>';}).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function searchBox(id,placeholder){return '<div class="toolbar"><input type="search" id="'+id+'" placeholder="'+esc(placeholder)+'" aria-label="'+esc(placeholder)+'"></div>';}
/* Reusable "My Card": cfg.staff() / cfg.member() return inner HTML. */
function renderMyCard(elId,user,cfg){
  var el=document.getElementById(elId);if(!el)return;
  var inner=isStaff(user)?(cfg.staff?cfg.staff():''):(cfg.member?cfg.member():'');
  el.innerHTML='<div class="card"><h2>My Card \u2014 '+esc(user.name)+' \u00B7 '+esc(roleLabel(user.roleKey))+'</h2>'+inner+'</div>';
}
function mine(user,name){return norm(name)!==''&&norm(name)===norm(user.name);}
</script>
<script>
(function(){
var user=initPage({title:'Exceptions & Safety',staffOnly:true});if(!user)return;
var CASES=[],NOTES=[],query='';
var WARN=['unresolved','open','pending','review'],OK=['resolved','closed','approved'];
function sc(s){var n=norm(s),i;for(i=0;i<WARN.length;i++)if(n.indexOf(WARN[i])>-1)return 'warn';for(i=0;i<OK.length;i++)if(n.indexOf(OK[i])>-1)return 'ok';return '';}
fetchExcel('exceptions.xlsx').then(function(wb){
  var a=readSheet(wb,['Exceptions'],['Date','Household ID','Type','Description','First Action Date','Status','Filed By','Resolved By','Resolution Date','Notes']);
  var b=[];try{b=readSheet(wb,['DebriefNotes','Debrief Notes'],['Date','Pod','Issue','Raised By','Noted By'],true);}catch(e){}
  CASES=a.map(function(r){
    var o={date:g(r,'Date'),hh:g(r,'Household ID'),type:g(r,'Type'),desc:g(r,'Description'),first:g(r,'First Action Date'),status:g(r,'Status'),filed:g(r,'Filed By'),resolver:g(r,'Resolved By'),resDate:g(r,'Resolution Date'),notes:g(r,'Notes')};
    o.tti=daysBetween(o.date,o.first);o.cls=sc(o.status);return o;
  }).sort(function(x,y){return String(y.date).localeCompare(String(x.date));});
  NOTES=b.map(function(r){return{date:g(r,'Date'),pod:g(r,'Pod'),issue:g(r,'Issue'),raised:g(r,'Raised By'),noted:g(r,'Noted By')};}).sort(function(x,y){return String(y.date).localeCompare(String(x.date));});
  render();
}).catch(function(e){CASES=[];NOTES=[];showBanner(e);render();});
function render(){
  renderMyCard('mycard',user,{staff:function(){
    var open=0,done=0,ts=0,tn=0,mineN=0;
    CASES.forEach(function(r){if(r.cls==='warn')open++;if(r.cls==='ok')done++;if(r.tti!==null&&r.tti>=0){ts+=r.tti;tn++;}if(mine(user,r.filed))mineN++;});
    return statsRow([stat('Total cases',CASES.length),stat('Open / pending',open,'',open?'warn':''),stat('Resolved / closed',done,'',done?'ok':''),stat('Avg time-to-intervention',tn?fmt(ts/tn)+' d':'\u2014',tn+' case(s) with a first action'),stat('Filed by me',mineN)]);
  }});
  document.getElementById('content').innerHTML=searchBox('s','Search cases and notes\u2026')+'<div class="section-title">Case log</div><div id="t1"></div><div class="section-title">Debrief notes</div><div id="t2"></div>';
  document.getElementById('s').oninput=function(){query=this.value;draw();};
  draw();
}
function draw(){
  var c=CASES.filter(function(r){return matches(r,query);}),n=NOTES.filter(function(r){return matches(r,query);});
  document.getElementById('t1').innerHTML=tableHTML([
   {h:'Date',f:function(r){return esc(r.date);}},{h:'Household',f:function(r){return esc(r.hh);}},{h:'Type',f:function(r){return esc(r.type);}},
   {h:'Status',f:function(r){return badge(r.status||'\u2014',r.cls);}},
   {h:'Description',f:function(r){return esc(r.desc);},wide:true},
   {h:'First Action',f:function(r){return esc(r.first)||'<span class="muted">None yet</span>';}},
   {h:'Time-to-Intervention',f:function(r){return r.tti===null?'<span class="muted">\u2014</span>':'<span class="num">'+r.tti+' day'+(r.tti===1?'':'s')+'</span>';}},
   {h:'Filed By',f:function(r){return esc(r.filed);}},{h:'Resolved By',f:function(r){return esc(r.resolver);}},{h:'Resolution Date',f:function(r){return esc(r.resDate);}},
   {h:'Notes',f:function(r){return esc(r.notes);},wide:true}
  ],c,function(r){return r.cls?'hl-'+r.cls:'';});
  document.getElementById('t2').innerHTML=tableHTML([
   {h:'Date',f:function(r){return esc(r.date);}},{h:'Pod',f:function(r){return esc(r.pod);}},{h:'Issue',f:function(r){return esc(r.issue);},wide:true},
   {h:'Raised By',f:function(r){return esc(r.raised);}},{h:'Noted By',f:function(r){return esc(r.noted);}}
  ],n);
}
})();
</script>
</body>
</html>
