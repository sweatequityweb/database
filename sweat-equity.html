<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweat Equity — Ugnayan Gulayan</title>
<script>try{var t=localStorage.getItem('ug-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#f4f5f7;--surface:#ffffff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;
--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 12px rgba(16,24,40,.06);
--ok-bg:#f0fdf4;--warn-bg:#fffbeb;--danger-bg:#fef2f2;--accent-bg:#eff6ff;--soft:#f9fafb}
[data-theme="dark"]{--bg:#0f1115;--surface:#171a21;--text:#e8eaed;--muted:#9aa3b2;--border:#262b36;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;
--ok-bg:#10281a;--warn-bg:#33270b;--danger-bg:#331616;--accent-bg:#172338;--soft:#1c2029;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border)}
.tb-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.tb-link{text-decoration:none;font-weight:600;white-space:nowrap}
.tb-title{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:8px}
.chip{font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--border);border-radius:99px;padding:3px 10px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.muted{color:var(--muted)}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.banner small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.stat .l{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase}
.stat .v{font-size:22px;font-weight:700;line-height:1.2}
.stat .s{font-size:12px;color:var(--muted)}
.stat.ok .v{color:var(--ok)}.stat.warn .v{color:var(--warn)}.stat.danger .v{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-block;font-size:12px;font-weight:650;border-radius:99px;padding:2px 10px;border:1px solid var(--border);background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.badge.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.badge.danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.badge.info{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.bar-row{margin:8px 0}
.bar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok span{background:var(--ok)}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
input[type=search],input[type=text]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:0}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.hl-warn{background:var(--warn-bg)}tr.hl-ok{background:var(--ok-bg)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--ok);font-weight:650}.neg{color:var(--danger);font-weight:650}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.section-title{font-size:15px;font-weight:700;margin:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;font-size:15px}.tile span{color:var(--muted);font-size:13px}
.people{max-height:50vh;overflow-y:auto;margin-top:10px}
.person{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.person:hover{border-color:var(--accent);background:var(--accent-bg)}
.login{max-width:560px;margin:24px auto}
@media (max-width:600px){
  .tb-link{font-size:13px}
  table,tbody{display:block;width:100%}
  thead{display:none}
  .table-wrap{background:none;border:0;box-shadow:none}
  tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
  tbody td{display:block;border:0;padding:0}
  tbody td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:650;color:var(--muted);text-transform:uppercase}
  tbody td.c-wide{grid-column:1 / -1}
  tbody tr.hl-warn{background:var(--warn-bg)}tbody tr.hl-ok{background:var(--ok-bg)}
}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="app">
<h1 id="h1">Sweat Equity</h1><div id="banner"></div><div id="mycard"></div><div id="content"><p class="muted">Loading…</p></div>
</main>
<script>
var SESSION_KEY='ug-current-user';
var CDN=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
var STAFF_ROLES=['committee','liaison','coordinator','documentation','treasurer','logistics','shift_lead'];
var MEMBER_ROLES=['parent','student'];
var ROLE_LABELS={committee:'Committee',liaison:'Farm Liaison',coordinator:'Coordinator',documentation:'Documentation',treasurer:'Treasurer',logistics:'Logistics',shift_lead:'Shift Lead',parent:'Parent',student:'Student'};
var WARN_BANNER='Data could not be loaded. Showing offline fallback. Please check the Excel file.';

/* ---- small utilities ---- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function norm(s){return String(s==null?'':s).trim().toLowerCase();}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;}
function fmt(n,d){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d==null?1:d});}
function peso(n){return (n<0?'-':'')+'\u20B1'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function g(o,h){var v=o[norm(h)];return v==null?'':v;}
function sGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function sSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function sDel(k){try{sessionStorage.removeItem(k);}catch(e){}}
function normRole(s){var r=norm(s).replace(/[\s\-]+/g,'_');return(STAFF_ROLES.indexOf(r)>-1||MEMBER_ROLES.indexOf(r)>-1)?r:'parent';}
function matches(o,q){q=norm(q);if(!q)return true;return Object.keys(o).some(function(k){var v=o[k];return(typeof v==='string'||typeof v==='number')&&String(v).toLowerCase().indexOf(q)>-1;});}

/* ---- Excel dates ---- */
function ymd(d){var m=d.getUTCMonth()+1,day=d.getUTCDate();return d.getUTCFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;}
function excelDate(v){
  if(v===''||v==null)return '';
  if(v instanceof Date)return ymd(v);
  if(typeof v==='number'){return(v>20000&&v<80000)?ymd(new Date(Math.round((v-25569)*86400000))):String(v);}
  var s=String(v).trim();
  if(/^\d{5}(\.\d+)?$/.test(s))return excelDate(parseFloat(s));
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  return s;
}
function daysBetween(a,b){
  var re=/^(\d{4})-(\d{2})-(\d{2})$/,x=re.exec(a||''),y=re.exec(b||'');
  if(!x||!y)return null;
  return Math.round((Date.UTC(+y[1],y[2]-1,+y[3])-Date.UTC(+x[1],x[2]-1,+x[3]))/86400000);
}

/* ---- SheetJS loading + Excel fetching ---- */
var _xlsxP=null;
function loadSheetJS(){
  if(window.XLSX)return Promise.resolve();
  if(_xlsxP)return _xlsxP;
  _xlsxP=new Promise(function(res,rej){
    var i=0;
    (function next(){
      if(i>=CDN.length){rej(new Error('SheetJS library could not be loaded'));return;}
      var s=document.createElement('script'),done=false;
      function fail(){if(done)return;done=true;s.remove();next();}
      s.async=true;s.src=CDN[i++];
      s.onload=function(){if(done)return;done=true;window.XLSX?res():next();};
      s.onerror=fail;setTimeout(fail,8000);
      document.head.appendChild(s);
    })();
  });
  return _xlsxP;
}
function withTimeout(p,ms,msg){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function fetchExcel(fileName){
  var p=Promise.all([loadSheetJS(),fetch('data/'+fileName+'?t='+Date.now(),{cache:'no-store'})]).then(function(r){
    if(!r[1].ok)throw new Error('data/'+fileName+' returned HTTP '+r[1].status);
    return r[1].arrayBuffer();
  }).then(function(buf){return XLSX.read(buf,{type:'array'});});
  return withTimeout(p,20000,'data/'+fileName+' timed out');
}
/* Finds the sheet by name, finds the header row within the first 10 rows, returns objects keyed by lower-case header. */
function readSheet(wb,names,headers,strict){
  var low=wb.SheetNames.map(norm),sn=null,i;
  for(i=0;i<names.length&&sn===null;i++){var k=low.indexOf(norm(names[i]));if(k>-1)sn=wb.SheetNames[k];}
  if(sn===null){if(strict)return[];sn=wb.SheetNames[0];}
  var aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  var want=headers.map(norm),best=-1,bs=0,r;
  for(r=0;r<Math.min(10,aoa.length);r++){var sc=0;aoa[r].forEach(function(c){if(want.indexOf(norm(c))>-1)sc++;});if(sc>bs){bs=sc;best=r;}}
  if(best<0||bs<2)throw new Error('Header row not found in sheet "'+sn+'"');
  var keys=aoa[best].map(norm),out=[];
  for(r=best+1;r<aoa.length;r++){
    var o={},any=false;
    keys.forEach(function(k,c){
      if(!k)return;
      var v=aoa[r][c];if(v==null)v='';
      if(typeof v==='string')v=v.trim();
      if(v!=='')any=true;
      if(k.indexOf('date')>-1||k.indexOf('checked')>-1)v=excelDate(v);
      o[k]=v;
    });
    if(any)out.push(o);
  }
  return out;
}

/* ---- session + role access ---- */
function getUser(){var s=sGet(SESSION_KEY);if(!s)return null;try{var u=JSON.parse(s);if(!u||!u.name)return null;u.roleKey=normRole(u.roleKey||u.role);return u;}catch(e){return null;}}
function isStaff(u){return !!u&&STAFF_ROLES.indexOf(u.roleKey)>-1;}
function roleLabel(r){return ROLE_LABELS[r]||r;}
function signOut(){sDel(SESSION_KEY);location.href='index.html';}

/* ---- page chrome ---- */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ug-theme',t);}catch(e){}}
function setupTopbar(title,hub){
  var u=getUser(),el=document.getElementById('topbar');
  el.innerHTML='<div class="tb-in">'+(hub?'':'<a class="tb-link" href="index.html">\u2190 Hub</a>')+'<div class="tb-title">'+esc(title)+'</div><div class="tb-right">'+
    (u?'<span class="chip" title="'+esc(roleLabel(u.roleKey))+'">'+esc(u.name)+'</span>':'')+
    '<button class="btn" id="themeBtn" type="button" aria-label="Toggle dark mode">\u25D0</button>'+
    (u?'<button class="btn" id="outBtn" type="button">Sign out</button>':'')+'</div></div>';
  document.getElementById('themeBtn').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};
  var o=document.getElementById('outBtn');if(o)o.onclick=signOut;
}
function initPage(opts){
  setupTopbar(opts.title,false);
  var u=getUser(),app=document.getElementById('app');
  if(!u){app.innerHTML='<div class="card login"><h1>Please sign in</h1><p class="muted">You need to choose your name on the hub page before viewing this module.</p><a class="btn primary" href="index.html" style="text-decoration:none;display:inline-block">Go to sign in</a></div>';return null;}
  if(opts.staffOnly&&!isStaff(u)){app.innerHTML='<div class="card login"><h1>Not available</h1><p class="muted">This module is only available to program staff. Parents and students can use Farm Points and Sweat Equity.</p><a class="btn primary" href="index.html" style="text-decoration:none;display:inline-block">Back to hub</a></div>';return null;}
  return u;
}
function showBanner(err){
  var b=document.getElementById('banner');if(!b)return;
  b.innerHTML='<div class="banner">\u26A0 '+esc(WARN_BANNER)+(err&&err.message?'<small>'+esc(err.message)+'</small>':'')+'</div>';
}

/* ---- reusable HTML builders ---- */
function stat(label,value,sub,cls){return '<div class="stat '+(cls||'')+'"><div class="l">'+esc(label)+'</div><div class="v">'+esc(value)+'</div>'+(sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div>';}
function statsRow(a){return '<div class="stats">'+a.join('')+'</div>';}
function badge(text,cls){return '<span class="badge '+(cls||'')+'">'+esc(text)+'</span>';}
function bar(label,val,max,ok){var p=max?Math.max(0,Math.min(val/max*100,100)):0;return '<div class="bar-row"><div class="bar-top"><span>'+esc(label)+'</span><span class="num">'+fmt(val)+' / '+fmt(max)+'</span></div><div class="bar'+(ok?' ok':'')+'"><span style="width:'+p.toFixed(1)+'%"></span></div></div>';}
/* cols: [{h:'Label', f:function(row){return html}, wide:true}] */
function tableHTML(cols,rows,rowClass){
  if(!rows.length)return '<div class="empty">No records to show.</div>';
  var h='<div class="table-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c.h)+'</th>';}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    var rc=rowClass?rowClass(r):'';
    h+='<tr'+(rc?' class="'+rc+'"':'')+'>'+cols.map(function(c){return '<td data-label="'+esc(c.h)+'"'+(c.wide?' class="c-wide"':'')+'>'+c.f(r)+'</td>';}).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function searchBox(id,placeholder){return '<div class="toolbar"><input type="search" id="'+id+'" placeholder="'+esc(placeholder)+'" aria-label="'+esc(placeholder)+'"></div>';}
/* Reusable "My Card": cfg.staff() / cfg.member() return inner HTML. */
function renderMyCard(elId,user,cfg){
  var el=document.getElementById(elId);if(!el)return;
  var inner=isStaff(user)?(cfg.staff?cfg.staff():''):(cfg.member?cfg.member():'');
  el.innerHTML='<div class="card"><h2>My Card \u2014 '+esc(user.name)+' \u00B7 '+esc(roleLabel(user.roleKey))+'</h2>'+inner+'</div>';
}
function mine(user,name){return norm(name)!==''&&norm(name)===norm(user.name);}
</script>
<script>
(function(){
var FALLBACK=[["HH-001", "MATEO ASUMEN BOBILES", 0, "Standard"], ["HH-002", "JUNRISH EBUENGA CAONES", 0, "Solo Parent"], ["HH-003", "RICHLYN LANDICHO CAPULO", 0, "Standard"], ["HH-004", "FRANCIS ALLESANDRO CASPE CUSTODIO", 0, "Standard"], ["HH-005", "REYNIEL ALLEN ROBLES ESCUETA", 0, "OFW"], ["HH-006", "JOHN CARLO BARRUGA LAZANAS", 0, "Standard"], ["HH-007", "PHILIP ANDREW CABALLERO LOGRONIO", 0, "Standard"], ["HH-008", "CANDICE BARLOLAY MOSQUERA", 0, "Solo Parent"], ["HH-009", "RHEAN MARK MAGANA PACHECO", 0, "Standard"], ["HH-010", "AKEESHA LIANNE ALCAZAR ROSALES", 0, "Standard"], ["HH-011", "JOSHUA DAVID RELLATORRES ROSAS", 0, "Standard"], ["HH-012", "VINCE ARON SANGALANG SUGUITAN", 0, "Standard"], ["HH-013", "TRICIA YHANIE ABITO BIEN", 0, "Standard"], ["HH-014", "KRIZZEL CADE AUSTRIA DERLA", 0, "Solo Parent"], ["HH-015", "HERSHEY MHAORI HERNANDEZ", 0, "Standard"], ["HH-016", "RHAYNE LUMAG MARTINEZ", 0, "Standard"], ["HH-017", "KEISHA BRICE PANOPIO MELEGRITO", 0, "Standard"], ["HH-018", "KYLE BRENAN SAGADRACA MENDOZA", 0, "Standard"], ["HH-019", "NICOLE ANNE UROT SABAL", 0, "OFW"], ["HH-020", "AIKEE MIKAELA MIRANDUQUE SANTOS", 0, "Standard"], ["HH-021", "QUIM DRIZEL QUIMIO TOLENTINO", 0, "Standard"], ["HH-022", "XYRA HYACINTH RODRIGUEZ CLEOPAS", 0, "Standard"], ["HH-023", "SAMANTHA RAGODON ECRAELA", 0, "Standard"], ["HH-024", "FAITH EUNICE FAMILIAR FLORES", 0, "Standard"], ["HH-025", "ERIC JOSH SANTIAGO GARCIA", 0, "Solo Parent"], ["HH-026", "ANGELU T. NUMERON", 0, "Standard"], ["HH-027", "NASH IVAN RAFALLO PANTOJA", 0, "Standard"], ["HH-028", "ALLYN BAUTISTA RONDINA", 0, "Standard"], ["HH-029", "HANNA KIMBERLIE VALERA FERNANDEZ", 0, "Standard"], ["HH-030", "ANYA NATALIE HERNANDEZ DETRUZ", 0, "Standard"], ["HH-031", "RHAINE JANNELLE SUA NACIONALES", 0, "Standard"], ["HH-032", "ANDREA NICOLE PAR MERCADO", 0, "Standard"], ["HH-033", "GRACE ANUYO UMALI", 0, "Standard"], ["HH-034", "EUSSEY AOE SAN JUAN DEINLA", 0, "Standard"], ["HH-035", "ARVEL NICOLE TERCERO UMALI", 0, "Solo Parent"], ["HH-036", "FRANCHESCA LUBANG SISCON", 0, "Standard"]];
var DIMS=[{k:'academic',h:'Academic',max:100},{k:'community',h:'Community',max:50},{k:'leadership',h:'Leadership',max:50},{k:'skills',h:'Skills',max:30},{k:'parental',h:'Parental',max:40}];
var MAXTOTAL=270;
var user=initPage({title:'Sweat Equity'});if(!user)return;
var staff=isStaff(user),DATA=[],query='';
function level(t){if(t>=201)return{n:4,label:'Level 4',share:100,cls:'ok'};if(t>=151)return{n:3,label:'Level 3',share:75,cls:'info'};if(t>=101)return{n:2,label:'Level 2',share:50,cls:'warn'};if(t>=1)return{n:1,label:'Level 1',share:25,cls:'danger'};return{n:0,label:'Not Started',share:0,cls:''};}
function build(r){
  var o={id:String(r.id).trim(),name:r.name,total:0};
  DIMS.forEach(function(d){o[d.k]=Math.max(0,Math.min(num(r[d.k]),d.max));o.total+=o[d.k];});
  o.level=level(o.total);return o;
}
fetchExcel('scholar-journal.xlsx').then(function(wb){
  var raw=readSheet(wb,['Roster'],['Household ID','Scholar','Academic','Community','Leadership','Skills','Parental']);
  DATA=raw.map(function(r){var o={id:g(r,'Household ID'),name:g(r,'Scholar')};DIMS.forEach(function(d){o[d.k]=g(r,d.h);});return build(o);}).filter(function(r){return r.id||r.name;});
  render();
}).catch(function(e){
  DATA=FALLBACK.map(function(a){return build({id:a[0],name:'Scholar of '+a[0]});});
  showBanner(e);render();
});
function scholarCard(r){
  return '<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>'+esc(r.name||'Scholar')+'</b><span>'+badge(r.level.label,r.level.cls)+' '+badge(r.level.share+'% share')+'</span></div>'+
    '<div class="muted" style="font-size:12px">Total points: <b class="num">'+fmt(r.total)+'</b> / '+MAXTOTAL+'</div>'+bar('Overall',r.total,MAXTOTAL,r.level.n===4)+
    DIMS.map(function(d){return bar(d.h,r[d.k],d.max);}).join('')+'</div>';
}
function render(){
  renderMyCard('mycard',user,{
    staff:function(){
      var tot=0,cnt={0:0,1:0,2:0,3:0,4:0};DATA.forEach(function(r){tot+=r.total;cnt[r.level.n]++;});
      return statsRow([stat('Scholars',DATA.length),stat('Average points',fmt(DATA.length?tot/DATA.length:0)),stat('Level 4',cnt[4],'100% share','ok'),stat('Not started',cnt[0])])+
        '<div class="chips">'+[4,3,2,1,0].map(function(n){var l=level(n===4?201:n===3?151:n===2?101:n===1?1:0);return badge(l.label+': '+cnt[n],l.cls);}).join('')+'</div>';
    },
    member:function(){
      var m=DATA.filter(function(r){return norm(r.id)===norm(user.household);});
      if(!m.length)return '<p class="muted">We could not find '+(user.household?'household '+esc(user.household):'a household on your profile')+' in the Sweat Equity roster. Please ask a coordinator.</p>';
      return m.map(scholarCard).join('');
    }
  });
  var c=document.getElementById('content');
  if(!staff){c.innerHTML='';return;}
  c.innerHTML=searchBox('s','Search scholar or household\u2026')+'<div id="tbl"></div>';
  document.getElementById('s').oninput=function(){query=this.value;draw();};
  draw();
}
function draw(){
  var rows=DATA.filter(function(r){return matches({a:r.id,b:r.name,c:r.level.label},query);});
  var cols=[{h:'Household',f:function(r){return '<b>'+esc(r.id)+'</b>';}},{h:'Scholar',f:function(r){return esc(r.name);},wide:true}];
  DIMS.forEach(function(d){cols.push({h:d.h,f:function(r){return '<span class="num">'+fmt(r[d.k])+'/'+d.max+'</span>';}});});
  cols.push({h:'Total',f:function(r){return '<b class="num">'+fmt(r.total)+'</b>';}});
  cols.push({h:'Level',f:function(r){return badge(r.level.label,r.level.cls);}});
  cols.push({h:'Share',f:function(r){return r.level.share+'%';}});
  document.getElementById('tbl').innerHTML=tableHTML(cols,rows);
}
})();
</script>
</body>
</html>
