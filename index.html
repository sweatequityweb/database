<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sweat Equity Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:wght@300;800&display=swap">
<style>
:root{box-sizing:border-box;--bg:#000;--s1:#15101c;--s2:#1f1830;--line:#352a4d;--p:#b388ff;--pc:#4a148c;--on:#ede7f6;--mut:#a99bc4;--warn:#ffd54f;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--on);font:400 15px/1.5 Roboto,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line);padding:12px 20px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font:800 22px/1 "Roboto Flex",Roboto,sans-serif;flex:1}
.yr{background:var(--pc);color:#fff;border-radius:16px;padding:4px 12px;font-weight:500;font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px;min-height:8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:500 14px Roboto;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--p);border-color:var(--p)}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #0008}
.card.hero{background:linear-gradient(135deg,var(--pc),#1a0933);border:0}
.big{font:800 44px/1 "Roboto Flex",Roboto,sans-serif;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font:500 18px Roboto;margin:24px 0 10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:500}tr.cl{cursor:pointer}tr.cl:hover{background:var(--s2)}.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--s2);color:var(--p);border:0;font-family:inherit}
.chip.c4{background:#1b5e20;color:#b9f6ca}.chip.c3{background:var(--pc);color:#fff}.chip.c2{background:#311b92;color:#d1c4e9}.chip.c1{background:#2a2140;color:var(--mut)}.chip.w{background:#4e3b00;color:var(--warn)}
button.chip{cursor:pointer;font-size:14px;padding:6px 14px;border-radius:16px}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;flex:1;min-width:160px}
label{font-size:12px;color:var(--mut)}
input,select{background:var(--s2);color:var(--on);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:2px solid var(--mut);padding:10px;font:inherit}
input:focus,select:focus{outline:0;border-bottom-color:var(--p)}
button.btn{background:var(--p);color:#1a0933;border:0;border-radius:20px;padding:10px 22px;font:500 14px Roboto;cursor:pointer;box-shadow:0 2px 6px #0009}
button.btn.o{background:none;color:var(--p);border:1px solid var(--line);box-shadow:none}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prev{background:var(--s2);border-left:4px solid var(--p);border-radius:8px;padding:12px;margin:12px 0}
.ladder{display:grid;gap:8px;margin-top:10px}.step{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.step.hit{background:var(--pc);border-color:var(--p)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#1a0933;border-radius:8px;padding:12px 20px;font-weight:500;z-index:9}
.scroll{overflow-x:auto}.err{color:var(--bad);min-height:20px;margin-top:8px}
.login{max-width:760px;margin:40px auto}
.rg{fill:none;stroke:var(--line)}.rp{fill:#b388ff55;stroke:var(--p);stroke-width:2}.rd{fill:var(--p)}.rt{fill:var(--on);font:12px Roboto}.rv{fill:var(--mut);font:11px Roboto}
@media(max-width:600px){main{padding:12px}.big{font-size:36px}}
</style></head><body>
<header><div class="bar"><h1>Sweat Equity Tracker</h1><span class="yr" id="yr"></span>
<label class="row" id="hl" hidden><input type="checkbox" id="hide" onchange="draw()" style="width:auto"> Hide names</label>
<button class="btn o" id="out" hidden onclick="FB.logout()">Sign out</button></div><nav id="nav"></nav></header>
<main id="main"></main>
<script>
const D="H01 7,H02 11,H03 12,H04 8,H04 10,H05 10,H05 12,H06 12,H07 12,H08 9,H08 12,H09 12,H10 8,H11 12,H12 9,H13 7,H14 8,H15 8,H16 7,H17 7,H17 8,H18 8,H19 8,H20 8,H21 7,H22 7,H23 7,H24 7,H25 8,H26 8,H27 8,H28 12,H29 8,H30 12,H31 12,H32 12,H33 11,H34 7,H35 11,H36 7".split(',').map((r,i)=>{const[h,g]=r.split(' ');return{id:'S'+String(i+1).padStart(3,'0'),hh:h,g:+g}});
const CAP={academic:999,community:75,leadership:90,skills:45,parental:50},REF={academic:340,community:75,leadership:90,skills:45,bonus:40,parental:50},AREAS={academic:'Academic',community:'Community',leadership:'Leadership',skills:'Skills',bonus:'Talent bonus',parental:'Parental'};
const TIERS={'Top (98–100)':100,'High Diligent (95–97.9)':80,'Diligent (90–94.9)':60,'Average (85–89.9)':40};
const ACT={academic:[['Report card tier','tier'],['Tutor',60],['Tutee',30],['Presentation',50],['Junior concept',20],['Project Phase 1',30],['Project Phase 2',30],['Project Phase 3 (clears gate)',20,'p3'],['Contest win bonus',20],['Publish bonus',30],['Ongoing business',50]],
community:[['Service instance',15],['Organized an event',25],['Mentoring (per mentee)',20]],leadership:[['Holding a position',40],['Leading a project',30],['Facilitating a workshop',20]],
skills:[['Internship',25],['Course',15],['Workshop',5],['Participation / training term',10]],bonus:[['Win',5],['Podium',2],['Representative selection',5],['Juried work',20]],parental:[['Volunteering',20],['Workshop',15],['Attended an event',10]]};
const LAD=[[800,1,30000],[600,.75,22500],[400,.5,15000],[200,.25,7500],[0,0,0]];
let ME=null,NAMES={},S={years:[2026],year:2026,logs:[]},tab='scholar',sel=null,q='',F={a:'academic',i:0,raw:100,id:'S001'},C={pts:450,g:7,p3:false};
const isA=()=>ME==='admin',peso=n=>'₱'+n.toLocaleString('en-PH'),P=n=>isA()?peso(n):'',wt=g=>g<=8?.75:1,cem=p=>LAD.find(r=>p>=r[0]),f1=n=>Math.round(n*100)/100;
const gIn=(s,y)=>s.g+(y-2026),yl=y=>`SY${y}-${y+1}`,rate=c=>c[1]*100+'%'+(isA()?' · '+peso(c[2]):'');
const nm=s=>(isA()&&!hide.checked&&NAMES[s.id])?`${NAMES[s.id].f} ${NAMES[s.id].l}`:'';
const lab=s=>[s.id,nm(s),'G'+s.g].filter(Boolean).join(' · ');
const authMsg=e=>({'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'Enter a valid email.','auth/operation-not-allowed':'This sign-in method is off. Enable it in Firebase Authentication.','auth/unauthorized-domain':'Add this site’s domain under Authentication → Settings → Authorized domains.','auth/too-many-requests':'Too many tries. Wait a few minutes.'}[e.code]||e.message);
const fbErr=e=>toast(e.code==='permission-denied'?'Not allowed. Only the admin can do that.':e.message);
function setMe(r){ME=r;if(!r){S.logs=[];NAMES={};sel=null}else tab=r==='admin'?'dash':'scholar';draw()}
function calc(s){let base=0,bon=0,rows=[];
 for(const y of S.years){const g=gIn(s,y);if(g>12)continue;const w=wt(g),by={};
  S.logs.filter(l=>l.sid===s.id&&l.y===y&&!l.v).forEach(l=>by[l.area]=(by[l.area]||0)+l.raw);
  let cp=0;for(const a in CAP)cp+=Math.min(by[a]||0,CAP[a]);const b=Math.min(by.bonus||0,40);
  rows.push({y,g,w,by,base:cp*w,bonus:b*w});base+=cp*w;bon+=b*w}
 const bc=Math.min(bon,120),cum=f1(base+bc),p3=S.logs.some(l=>l.sid===s.id&&l.p3&&!l.v),gate=s.g<=8,held=gate&&!p3&&cum>=800,gt=held?799:cum;
 return{rows,cum,gt,p3,gate,held,bc,c:cem(gt)}}
const cc=c=>c>=1?'c4':c>=.75?'c3':c>=.5?'c2':c>0?'c1':'';
const all=()=>D.map(s=>({s,t:calc(s)}));
function draw(){yr.textContent=yl(S.year);out.hidden=!ME;hl.hidden=!isA();
 if(!ME){nav.innerHTML='';main.innerHTML=loginV();return}
 const T=isA()?{dash:'Dashboard',scholar:'Scholar',award:'Award points',calc:'Grant calculator',data:'Data & years'}:{scholar:'Find a scholar',calc:'Grant calculator'};
 if(!T[tab])tab='scholar';
 nav.innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';draw()">${v}</button>`).join('');
 main.innerHTML=({dash,scholar,award,calc:calcV,data})[tab]();if(tab==='award')prev()}
function loginV(){return`<div class="login grid"><div class="card"><h2 style="margin-top:0">Admin</h2><p class="mut">Full access with your password.</p>
 <div class="field"><label>Email</label><input id="lem" type="email" value="admin@lla.edu" autocomplete="username"></div><div class="field"><label>Password</label><input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdmin()"></div>
 <button class="btn" onclick="doAdmin()">Sign in</button></div>
 <div class="card"><h2 style="margin-top:0">Viewer</h2><p class="mut">No password. Look up a scholar by ID to see points and grant rate. Names are not shown.</p><button class="btn o" onclick="doViewer()">Continue as viewer</button></div></div><div class="err" id="err" style="text-align:center"></div>`}
function doAdmin(){err.textContent='';FB.login(lem.value.trim(),lpw.value).catch(e=>err.textContent=authMsg(e))}
function doViewer(){err.textContent='';FB.viewer().catch(e=>err.textContent=authMsg(e))}
function dash(){const a=all().sort((x,y)=>y.t.gt-x.t.gt),tot=a.reduce((n,x)=>n+x.t.cum,0),t100=a.filter(x=>x.t.c[1]>=1).length,held=a.filter(x=>x.t.held).length,pay=a.reduce((n,x)=>n+x.t.c[2],0);
 return`<div class="grid"><div class="card hero"><div class="mut" style="color:#d1c4e9">Cumulative points awarded</div><div class="big">${f1(tot).toLocaleString()}</div></div>
 <div class="card"><div class="mut">Scholars · households</div><div class="big">40 · 36</div></div>
 <div class="card"><div class="mut">At 100% grant</div><div class="big">${t100}</div></div>
 <div class="card"><div class="mut">Held by project gate</div><div class="big">${held}</div></div>
 <div class="card"><div class="mut">Grant value at current points</div><div class="big" style="font-size:30px">${peso(pay)}</div></div></div>
 <div class="card" style="margin-top:14px"><b>Grades 7–8 carry a ×0.75 weight.</b> <span class="mut">22 of 40 scholars are in these grades, so their totals run lower than their raw points. That is the program rule, not a bug.</span></div>
 <h2>Leaderboard</h2><div class="card scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Grade</th><th class="num">Cumulative</th><th>Grant</th></tr></thead><tbody>
 ${a.map(({s,t})=>{const g=gIn(s,S.year);return`<tr class="cl" onclick="sel='${s.id}';tab='scholar';draw()"><td>${s.id}</td><td>${nm(s)||'—'}</td><td>${g>12?'Graduated':g+` (×${wt(g)})`}</td><td class="num">${t.gt}${t.held?' <span class="chip w">gate</span>':''}</td><td><span class="chip ${cc(t.c[1])}">${rate(t.c)}</span></td></tr>`}).join('')}</tbody></table></div>`}
function radar(by,w){const ks=Object.keys(AREAS),cx=150,cy=140,R=90,pt=(i,f)=>{const a=(-90+60*i)*Math.PI/180;return[cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)]};
 const val=k=>Math.min(by[k]||0,k==='bonus'?40:CAP[k]);
 const poly=ks.map((k,i)=>pt(i,Math.min(1,val(k)/REF[k])).map(n=>n.toFixed(1)).join(',')).join(' ');
 return`<svg viewBox="0 0 300 290" role="img" aria-label="Radar chart of points by area" style="width:100%;max-width:420px;display:block;margin:auto">
 ${[.25,.5,.75,1].map(f=>`<polygon class="rg" points="${ks.map((_,i)=>pt(i,f).join(',')).join(' ')}"/>`).join('')}
 ${ks.map((_,i)=>`<line class="rg" x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}"/>`).join('')}
 <polygon class="rp" points="${poly}"/>
 ${ks.map((k,i)=>{const[x,y]=pt(i,Math.min(1,val(k)/REF[k])),[lx,ly]=pt(i,1.3),an=lx<cx-5?'end':lx>cx+5?'start':'middle';return`<circle class="rd" cx="${x}" cy="${y}" r="3.5"/><text class="rt" x="${lx}" y="${ly}" text-anchor="${an}">${AREAS[k]}</text><text class="rv" x="${lx}" y="${ly+13}" text-anchor="${an}">${val(k)}/${k==='academic'?999:REF[k]}</text>`}).join('')}</svg>`}
function results(){const m=q.trim().toLowerCase();if(!m)return'<span class="mut">Type a scholar ID, like S004.</span>';
 const r=D.filter(x=>x.id.toLowerCase().includes(m)).slice(0,12);return r.length?r.map(x=>`<button class="chip" onclick="sel='${x.id}';draw()">${x.id} · Grade ${x.g}</button>`).join(' '):'<span class="mut">No scholar with that ID. Check the ID and try again.</span>'}
function scholar(){
 const find=isA()?`<div class="field"><label>Scholar</label><select onchange="sel=this.value;draw()"><option value="">Choose…</option>${D.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${lab(x)}</option>`).join('')}</select></div>`
 :`<div class="field"><label>Scholar ID</label><input value="${q}" placeholder="S004" oninput="q=this.value;res.innerHTML=results()"></div></div><div class="row" id="res" style="margin:6px 0 10px">${results()}</div><div hidden>`;
 const head=`<div class="row">${find}</div>`;
 const s=D.find(x=>x.id===sel);if(!s)return head+(isA()?'<p class="mut">Choose a scholar to see their points.</p>':'');
 const t=calc(s),r=t.rows.find(x=>x.y===S.year),g=gIn(s,S.year),by=r?r.by:{};
 const logs=S.logs.filter(l=>l.sid===s.id&&l.y===S.year).slice().sort((a,b)=>b.date>a.date?1:-1);
 return head+`<div class="grid"><div class="card hero"><div class="mut" style="color:#d1c4e9">${s.id}${nm(s)?' · '+nm(s):''}${isA()?' · '+s.hh:''}</div><div class="big">${t.gt}<span style="font-size:20px">/800</span></div><div>Grade ${g>12?'—':g+' (×'+wt(g)+')'} · entered at Grade ${s.g}</div></div>
 <div class="card"><div class="mut">Grant</div><div class="big">${t.c[1]*100}%</div><div>${P(t.c[2])}</div></div>
 <div class="card"><div class="mut">Project gate</div><div style="margin-top:8px"><span class="chip ${t.held?'w':'c4'}">${!t.gate?'Not applicable (entry Grade 9+)':t.p3?'Cleared · Phase 3 on record':t.held?'Held at 799 · needs Phase 3':'Pending · needs Phase 3 before 800'}</span></div></div></div>
 <h2>${yl(S.year)} stat graph</h2><div class="card">${radar(by)}<p class="mut" style="text-align:center">Each axis shows points against its annual cap. Academic is scaled to about 340, the realistic yearly maximum.</p></div>
 <h2>Year by year</h2><div class="card scroll"><table><thead><tr><th>Year</th><th>Grade</th><th class="num">Base</th><th class="num">Talent bonus</th><th class="num">Year total</th></tr></thead><tbody>${t.rows.map(x=>`<tr><td>${yl(x.y)}</td><td>${x.g} (×${x.w})</td><td class="num">${f1(x.base)}</td><td class="num">${f1(x.bonus)}</td><td class="num">${f1(x.base+x.bonus)}</td></tr>`).join('')}</tbody></table><p class="mut">Talent bonus lifetime cap is 120. Counted: ${f1(t.bc)}.</p></div>
 <h2>Log history</h2><div class="card scroll">${logs.length?`<table><thead><tr><th>Date</th><th>Area</th><th>Activity</th><th class="num">Raw</th>${isA()?'<th></th>':''}</tr></thead><tbody>${logs.map(l=>`<tr style="${l.v?'opacity:.4;text-decoration:line-through':''}"><td>${l.date}</td><td>${AREAS[l.area]}</td><td>${l.act}${l.hh?' <span class="chip">household</span>':''}</td><td class="num">${l.raw}</td>${isA()?`<td>${l.v?'':`<button class="btn o" onclick="voidLog('${l.id}')">Void</button>`}</td>`:''}</tr>`).join('')}</tbody></table>`:`<p class="mut">No logs for ${s.id} yet this year.${isA()?' Award the first points from the Award points tab.':''}</p>`}</div>`}
function voidLog(id){if(confirm('Void this log? It stays on record but stops counting.'))FB.voidLog(id).then(()=>toast('Log voided')).catch(fbErr)}
function award(){const A=ACT[F.a],it=A[F.i]||A[0];
 return`<div class="card"><div class="row"><div class="field"><label>Scholar (for Parental: any scholar in the household)</label><select onchange="F.id=this.value;draw()">${D.map(x=>`<option value="${x.id}" ${x.id===F.id?'selected':''}>${lab(x)}</option>`).join('')}</select></div>
 <div class="field"><label>Area</label><select onchange="F.a=this.value;F.i=0;F.raw=ACT[F.a][0][1]==='tier'?100:ACT[F.a][0][1];draw()">${Object.entries(AREAS).map(([k,v])=>`<option value="${k}" ${k===F.a?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="field"><label>Activity</label><select onchange="F.i=+this.value;const v=ACT[F.a][F.i][1];F.raw=v==='tier'?100:v;draw()">${A.map((x,i)=>`<option value="${i}" ${i===F.i?'selected':''}>${x[0]}</option>`).join('')}</select></div></div>
 <div class="row">${it[1]==='tier'?`<div class="field"><label>Report card tier</label><select onchange="F.raw=+this.value;draw()">${Object.entries(TIERS).map(([k,v])=>`<option value="${v}" ${v===F.raw?'selected':''}>${k} → ${v}</option>`).join('')}</select></div>`:`<div class="field"><label>Raw points</label><input type="number" min="0" value="${F.raw}" oninput="F.raw=+this.value;prev()"></div>`}
 <div class="field"><label>Date</label><input type="date" id="dt" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Note</label><input id="nt"></div></div>
 <div class="prev" id="prev"></div><button class="btn" onclick="saveAward()">Award points</button></div>`}
function targets(){const s=D.find(x=>x.id===F.id);return F.a==='parental'?D.filter(x=>x.hh===s.hh&&gIn(x,S.year)<=12):[s]}
function prev(){const e=document.getElementById('prev');if(!e)return;const a=F.a,cap=a==='bonus'?40:CAP[a];e.innerHTML=targets().map(s=>{const w=wt(gIn(s,S.year)),c=Math.min(F.raw,cap);return`<div><b>${s.id}</b> · raw ${F.raw} → capped ${c} → ×${w} → <b>${f1(c*w)}</b> weighted${F.raw>cap?' <span class="chip w">over annual cap</span>':''}</div>`}).join('')+(a==='parental'?'<div class="mut">One log per active sibling, each weighted to that sibling’s grade.</div>':'')+(a==='bonus'?'<div class="mut">Annual cap 40 and lifetime cap 120 apply to the total, not each entry.</div>':'')}
function saveAward(){const it=ACT[F.a][F.i];if(!(F.raw>=0)){toast('Enter points of 0 or more.');return}
 const arr=targets().map(s=>({sid:s.id,y:S.year,area:F.a,act:it[0],raw:F.raw,date:dt.value,note:nt.value,hh:F.a==='parental',p3:it[2]==='p3',v:false}));
 FB.addLogs(arr).then(()=>toast('Points awarded')).catch(fbErr)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function calcV(){const gate=C.g<=8,held=gate&&!C.p3&&C.pts>=800,p=held?799:C.pts,c=cem(p),nx=LAD.slice().reverse().find(r=>r[0]>p);
 return`<div class="grid"><div class="card"><h2 style="margin-top:0">Grant calculator</h2><div class="field"><label>Cumulative points</label><input type="number" min="0" value="${C.pts}" oninput="C.pts=+this.value||0;calcU()"></div><input type="range" min="0" max="1200" value="${Math.min(C.pts,1200)}" oninput="C.pts=+this.value;draw()" style="padding:0;accent-color:#b388ff;width:100%">
 <div class="field"><label>Entry grade</label><select onchange="C.g=+this.value;draw()">${[7,8,9,10,11,12].map(g=>`<option ${g===C.g?'selected':''}>${g}</option>`).join('')}</select></div>
 <label class="row"><input type="checkbox" style="width:auto" ${C.p3?'checked':''} onchange="C.p3=this.checked;draw()"> Phase 3 project completed</label>
 <div class="field"><label>Or load a scholar</label><select onchange="const x=D.find(x=>x.id===this.value);if(x){C.pts=calc(x).cum;C.g=x.g;draw()}"><option value="">Choose…</option>${D.map(x=>`<option value="${x.id}">${lab(x)}</option>`).join('')}</select></div></div>
 <div class="card hero"><div class="mut" style="color:#d1c4e9">Grant at ${p} points</div><div class="big">${c[1]*100}%</div>${isA()?`<div style="font-size:22px;margin-top:6px">${peso(c[2])}</div>`:''}
 <p>${held?'The project gate holds this scholar at 799. Completing Phase 3 releases the 100% grant.':nx?`${nx[0]-p} more points reach ${nx[1]*100}%${isA()?' ('+peso(nx[2])+')':''}.`:'Top tier reached.'}</p></div></div>
