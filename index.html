<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sweat Equity Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:wght@300;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;--bg:#000;--s1:#15101c;--s2:#1f1830;--line:#352a4d;--p:#b388ff;--pc:#4a148c;--on:#ede7f6;--mut:#a99bc4;--warn:#ffd54f;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--on);font:400 15px/1.5 Roboto,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line);padding:12px 20px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font:800 22px/1 "Roboto Flex",Roboto,sans-serif;flex:1}
.yr{background:var(--pc);color:#fff;border-radius:16px;padding:4px 12px;font-weight:500;font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px;min-height:8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:500 14px Roboto;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--p);border-color:var(--p)}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #0008}
.card.hero{background:linear-gradient(135deg,var(--pc),#1a0933);border:0}
.big{font:800 44px/1 "Roboto Flex",Roboto,sans-serif;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font:500 18px Roboto;margin:24px 0 10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:500}tr.cl{cursor:pointer}tr.cl:hover{background:var(--s2)}.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--s2);color:var(--p);border:0;font-family:inherit}
.chip.c4{background:#1b5e20;color:#b9f6ca}.chip.c3{background:var(--pc);color:#fff}.chip.c2{background:#311b92;color:#d1c4e9}.chip.c1{background:#2a2140;color:var(--mut)}.chip.w{background:#4e3b00;color:var(--warn)}
button.chip{cursor:pointer;font-size:14px;padding:6px 14px;border-radius:16px}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;flex:1;min-width:160px}
label{font-size:12px;color:var(--mut)}
input,select{background:var(--s2);color:var(--on);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:2px solid var(--mut);padding:10px;font:inherit}
input:focus,select:focus{outline:0;border-bottom-color:var(--p)}
button.btn{background:var(--p);color:#1a0933;border:0;border-radius:20px;padding:10px 22px;font:500 14px Roboto;cursor:pointer;box-shadow:0 2px 6px #0009}
button.btn.o{background:none;color:var(--p);border:1px solid var(--line);box-shadow:none}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prev{background:var(--s2);border-left:4px solid var(--p);border-radius:8px;padding:12px;margin:12px 0}
.ladder{display:grid;gap:8px;margin-top:10px}.step{display:flex;justify-content:space-between;padding:8px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:14px}
.step.hit{background:var(--pc);border-color:var(--p)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#1a0933;border-radius:8px;padding:12px 20px;font-weight:500;z-index:9;max-width:90vw}
.scroll{overflow-x:auto}.err{color:var(--bad);min-height:20px;margin-top:8px}
.login{max-width:760px;margin:40px auto}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dt{color:var(--mut);font-size:13px}dd{margin:0;word-break:break-word}
.rg{fill:none;stroke:var(--line)}.rp{fill:#b388ff55;stroke:var(--p);stroke-width:2}.rd{fill:var(--p)}.rt{fill:var(--on);font:12px Roboto}.rv{fill:var(--mut);font:11px Roboto}
.tick{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;color:var(--p);font-weight:700;font-size:12px;line-height:1}
tr.on .tick{border-color:var(--p)}
@media(max-width:600px){main{padding:12px}.big{font-size:36px}}
[hidden]{display:none!important}
button.btn,button.chip,nav button,input,select{min-height:48px}
header{padding-top:calc(12px + env(safe-area-inset-top))}
@media(max-width:700px){
 nav{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:6}
 nav button{flex:1;min-height:60px;border-bottom:0;border-top:3px solid transparent;padding:8px 4px;font-size:12px}
 nav button.on{border-top-color:var(--p)}
 main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}.toast{bottom:84px}td,th{padding:12px 10px}
 table.rc thead{display:none}table.rc,table.rc tbody,table.rc tr,table.rc td{display:block;width:100%}
 table.rc tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 12px;background:var(--s1)}
 table.rc td{border:0;display:flex;justify-content:space-between;gap:12px;text-align:right;padding:6px 0}
 table.rc td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left;flex:none}table.rc td:empty{display:none}}
@media(prefers-color-scheme:light){
 :root{--bg:#faf7ff;--s1:#fff;--s2:#f1eaff;--line:#d9ccf0;--p:#6a1b9a;--pc:#e1d1f7;--on:#1d1230;--mut:#5d4f78;--warn:#6d5400;--bad:#b3261e;color-scheme:light}
 header{background:#fff}.yr,button.btn,.toast,.chip.c3{background:#6a1b9a;color:#fff}button.btn.o{background:none;color:#6a1b9a}
 .card{box-shadow:0 1px 4px #4a148c22}.card.hero{background:linear-gradient(135deg,#6a1b9a,#38006b);color:#fff}
 .chip.c4{background:#c8e6c9;color:#1b5e20}.chip.c2{background:#d1c4e9;color:#311b92}.chip.c1{background:#ece6f5}.chip.w{background:#fff3c4;color:#6d5400}.step.hit{background:#e1d1f7}}
.bdg{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:4px}
.pb{background:var(--s2);height:10px;border-radius:6px;overflow:hidden;margin-top:6px}.pb>i{display:block;height:100%;background:var(--p);border-radius:6px}
.ir .rt{font:500 15px Roboto,system-ui,sans-serif}.ir .rv{font:13px Roboto,system-ui,sans-serif}
.pb.tot{height:18px;border:1px solid var(--p)}.pb.tot>i{background:linear-gradient(90deg,var(--p),#ff80ab)}
.ws{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}.ws.solo{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:112px;--ph:max(200px,calc(100vh - 340px))}.ws section{min-width:0}
.sub{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;width:max-content;max-width:100%}
.sub button{background:none;border:0;color:var(--mut);font:500 14px Roboto,system-ui,sans-serif;padding:8px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;min-height:40px}.sub button.on{background:var(--pc);color:var(--on)}
.back{display:none}
@media(max-width:900px){.ws{grid-template-columns:1fr}.ws.has .side{display:none}.ws.has .back{display:inline-block}.side{position:static}}
@media print{.ws{display:block!important}header,nav,aside,.sub,.back,button,.row button{display:none!important}body{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{box-shadow:none;break-inside:avoid}.hero{background:#fff!important;color:#000!important;border:1px solid #999}.hero .mut{color:#444!important}}
</style></head><body>
<header><div class="bar"><h1>Sweat Equity Tracker</h1><span class="yr" id="yr"></span>
<label class="row" id="hl" hidden><input type="checkbox" id="hide" onchange="draw()" style="width:auto"> Hide names</label>
<button class="btn o" id="out" hidden onclick="FB.logout()">Sign out</button></div><nav id="nav"></nav></header>
<main id="main"></main>
<script>
const CAP={academic:999,community:75,leadership:90,skills:45,parental:50},REF={academic:340,community:75,leadership:90,skills:45,bonus:40,parental:50},AREAS={academic:'Academic',community:'Community',leadership:'Leadership',skills:'Skills',bonus:'Talent bonus',parental:'Parental'};
const TIERS={'Top (98–100)':100,'High Diligent (95–97.9)':80,'Diligent (90–94.9)':60,'Average (85–89.9)':40};
const ACT={academic:[['Report card tier','tier'],['Tutor',60],['Tutee',30],['Presentation',50],['Junior concept',20],['Project Phase 1',30],['Project Phase 2',30],['Project Phase 3 (clears gate)',20,'p3'],['Contest win bonus',20],['Publish bonus',30],['Ongoing business',50]],
community:[['Service instance',15],['Organized an event',25],['Mentoring (per mentee)',20]],leadership:[['Holding a position',40],['Leading a project',30],['Facilitating a workshop',20]],
skills:[['Internship',25],['Course',15],['Workshop',5],['Participation / training term',10]],bonus:[['Win',5],['Podium',2],['Representative selection',5],['Juried work',20]],parental:[['Volunteering',20],['Workshop',15],['Attended an event',10]]};
const LAD=[[800,1,30000],[600,.75,22500],[400,.5,15000],[200,.25,7500],[0,0,0]];
// Personal fields (database only). Parent skills is stored but never shown.
const FLD=[['last','Last name'],['first','First name'],['middle','Middle name'],['barangay','Barangay'],['address','Address'],['gender','Gender'],['citizenship','Citizenship'],['religion','Religion'],['fatherName',"Father's name"],['fatherJob',"Father's occupation"],['motherName',"Mother's name"],['motherJob',"Mother's occupation"],['email','Email'],['contact','Contact number']];
const HMAP={scholarid:'id',id:'id',householdid:'hh',household:'hh',entrygrade:'g0',entryyear:'y0',gradelevel:'grade',grade:'grade',lastname:'last',firstname:'first',middlename:'middle',barangay:'barangay',address:'address',gender:'gender',citizenship:'citizenship',religion:'religion',fathersname:'fatherName',fathersoccupation:'fatherJob',mothersname:'motherName',mothersoccupation:'motherJob',emailaddress:'email',email:'email',contactnumber:'contact',contact:'contact',parentskills:'parentSkills'};
let AUTHUSER=null,UDOC=null,IN={},INL={},INLA=false,dsb='points',ig='type',wtab='points',st='access',US=[],LOADED=false,ME=null,SC=[],INFO={},S={years:[2026],year:2026,logs:[]},tab='scholars',sel=null,q='',editing=false,PEND=null,RM='cap',F={a:'academic',i:0,raw:100,id:null,date:'',note:'',att:'',ev:''},W={add:0,p3:false,pts:450,g:7};
const isA=()=>ME==='admin',isT=()=>ME==='teacher',isS=()=>isA()||isT(),peso=n=>'₱'+n.toLocaleString('en-PH'),P=n=>isA()?peso(n):'',wt=g=>g<=8?.75:1,cem=p=>LAD.find(r=>p>=r[0]),f1=n=>Math.round(n*100)/100;
const today=()=>new Date().toISOString().slice(0,10);
const gIn=(s,y)=>s.g0+(y-s.y0),yl=y=>`SY${y}-${y+1}`,rate=c=>c[1]*100+'%'+(isA()?' · '+peso(c[2]):''),norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=s=>{const i=INFO[s.id];return isS()&&!hide.checked&&i&&(i.first||i.last)?`${i.first||''} ${i.last||''}`.trim():''};
const gl=s=>{const g=gIn(s,S.year);return g>12?'Grad':'G'+g};
const lab=s=>[s.id,nm(s),gl(s)].filter(Boolean).join(' · ');
const authMsg=e=>({'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'Enter a valid email.','auth/popup-blocked':'Your browser blocked the Google window. Allow pop-ups for this site and try again.','auth/operation-not-allowed':'This sign-in method is off. Enable it in Firebase Authentication → Sign-in method.','auth/unauthorized-domain':'Add this site’s domain under Authentication → Settings → Authorized domains.','auth/too-many-requests':'Too many tries. Wait a few minutes.'}[e.code]||e.message);
const fbErr=e=>toast(e.code==='permission-denied'?'Not allowed for your account.':e.message);
function uiLoad(){try{const o=JSON.parse(localStorage.getItem('lla.ui')||'null');if(o&&AUTHUSER&&o.u===AUTHUSER.uid){tab=o.tab||tab;wtab=o.wtab||wtab;st=o.st||st;dsb=o.dsb||dsb;ig=o.ig||ig;sel=o.sel||null}}catch(e){}}
function uiSave(){try{if(ME&&ME!=='new'&&ME!=='wait'&&AUTHUSER)localStorage.setItem('lla.ui',JSON.stringify({u:AUTHUSER.uid,tab,wtab,st,dsb,ig,sel}))}catch(e){}}
function setMe(r){ME=r;if(!r){S.logs=[];SC=[];INFO={};IN={};INL={};INLA=false;sel=null;PEND=null;LOADED=false}else{tab=r==='admin'?'dash':'scholars';uiLoad()}draw()}
function calc(s,extra){
 const lg=extra&&extra.length?S.logs.concat(extra):S.logs;
 let base=0,bon=0,rows=[],byAll={};
 for(const y of S.years){const g=gIn(s,y);if(g>12||g<7)continue;const w=wt(g),by={};
  lg.filter(l=>l.sid===s.id&&l.y===y&&!l.v).forEach(l=>by[l.area]=(by[l.area]||0)+l.raw);
  let cp=0;for(const a in CAP){const v=Math.min(by[a]||0,CAP[a]);cp+=v;byAll[a]=(byAll[a]||0)+v*w}
  const b=Math.min(by.bonus||0,40);byAll.bonus=(byAll.bonus||0)+b*w;
  rows.push({y,g,w,by,base:cp*w,bonus:b*w});base+=cp*w;bon+=b*w}
 const bc=Math.min(bon,120),cum=f1(base+bc),p3=lg.some(l=>l.sid===s.id&&l.p3&&!l.v),gate=s.g0<=8,held=gate&&!p3&&cum>=800,gt=held?799:cum;
 return{rows,cum,gt,p3,gate,held,bc,c:cem(gt),byAll}
}
const cc=c=>c>=1?'c4':c>=.75?'c3':c>=.5?'c2':c>0?'c1':'';
const all=()=>SC.map(s=>({s,t:calc(s)}));
function pick(id){sel=id||null;editing=false;W.add=0;const s=SC.find(x=>x.id===id);W.p3=s?calc(s).p3:false;if(id)F.id=id;draw()}
function draw(){yr.textContent=yl(S.year);out.hidden=!ME;hl.hidden=!isS();
 if(!ME){nav.innerHTML='';main.innerHTML=loginV();return}
 if(ME==='new'||ME==='wait'){nav.innerHTML='';main.innerHTML=ME==='new'?newV():waitV();return}
 const T=isA()?{dash:'Dashboard',scholars:'Scholars',program:'Program',settings:'Settings'}:isT()?{dash:'Dashboard',scholars:'Scholars',program:'Program',settings:'Access'}:{scholars:SC.length>1?'My scholars':'My scholar',program:'Program'};
 if(!T[tab])tab='scholars';
 nav.innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';draw()">${v}${k==='settings'&&US.some(u=>u.status==='pending')?`<span class="bdg">${US.filter(u=>u.status==='pending').length}</span>`:''}</button>`).join('');
 main.innerHTML=({dash:dashV,scholars:workspace,settings:settingsV,program:programV})[tab]();
 if(tab==='scholars'&&wtab==='award')prev();cardify();uiSave()}
function loginV(){return`<div class="login grid"><div class="card"><h2 style="margin-top:0">Staff</h2><p class="mut">Admin and teacher accounts. Sign in with your password.</p>
 <div class="field"><label>Email</label><input id="lem" type="email" placeholder="you@lla.edu" autocomplete="username"></div><div class="field"><label>Password</label><input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdmin()"></div>
 <button class="btn" onclick="doAdmin()">Sign in</button></div>
 <div class="card"><h2 style="margin-top:0">Parents and scholars</h2><p class="mut">Sign in with Google. A teacher or admin connects your account to your scholar, and you only see your own records.</p><button class="btn o" onclick="doGoogle()">Sign in with Google</button></div></div><div class="err" id="err" style="text-align:center"></div>`}
function doAdmin(){err.textContent='';FB.login(lem.value.trim(),lpw.value).catch(e=>err.textContent=authMsg(e))}
function doGoogle(){err.textContent='';FB.google().catch(e=>{if(e.code!=='auth/popup-closed-by-user')err.textContent=authMsg(e)})}
const empty=()=>!LOADED?`<div class="card mut">Loading…</div>`:`<div class="card">${isA()?'No scholars in the database yet. Open <b>Data & years</b> and import your scholars Excel file.':'No scholar data yet. Ask the admin to load it.'}</div>`;
function dash(){if(!SC.length)return empty();const a=all().sort((x,y)=>y.t.gt-x.t.gt),tot=a.reduce((n,x)=>n+x.t.cum,0),t100=a.filter(x=>x.t.c[1]>=1).length,held=a.filter(x=>x.t.held).length,hh=new Set(SC.map(s=>s.hh)).size,lo=SC.filter(s=>gIn(s,S.year)<=8).length;
 return`<div class="grid"><div class="card hero"><div class="mut" style="color:#d1c4e9">Cumulative points awarded</div><div class="big">${f1(tot).toLocaleString()}</div></div>
 <div class="card"><div class="mut">Scholars · households</div><div class="big">${SC.length} · ${hh}</div></div>
 <div class="card"><div class="mut">At 100% grant</div><div class="big">${t100}</div></div>
 <div class="card"><div class="mut">Held by project gate</div><div class="big">${held}</div></div></div>
 <div class="card" style="margin-top:14px"><b>Grades 7–8 carry a ×0.75 weight.</b> <span class="mut">${lo} of ${SC.length} scholars are in these grades this year, so their totals run lower than their raw points. That is the program rule, not a bug.</span></div>
 <h2>Leaderboard</h2><div class="card scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Grade</th><th class="num">Cumulative</th><th>Grant</th></tr></thead><tbody>
 ${a.map(({s,t})=>{const g=gIn(s,S.year);return`<tr class="cl" onclick="tab='scholars';wtab='points';pick('${s.id}')"><td>${s.id}</td><td>${esc(nm(s))||'—'}</td><td>${g>12?'Graduated':g+` (×${wt(g)})`}</td><td class="num">${t.gt}${t.held?' <span class="chip w">gate</span>':''}</td><td><span class="chip ${cc(t.c[1])}">${t.c[1]*100}%</span></td></tr>`}).join('')}</tbody></table></div>`}
/* ---- Radar: 5 spokes, Talent bonus folded into Skills ---- */
const R5=[['academic','Academic',340],['skills','Skills + bonus',85],['leadership','Leadership',90],['community','Community',75],['parental','Parental',50]];
function radar(by){
 const cx=200,cy=160,R=90,LR=113;
 const vals=R5.map(([k])=>k==='skills'?Math.min(by.skills||0,CAP.skills)+Math.min(by.bonus||0,40):Math.min(by[k]||0,CAP[k]));
 const tot=vals.reduce((a,b)=>a+b,0);
 const frac=i=>RM==='share'?(tot?vals[i]/tot:0):Math.min(1,vals[i]/R5[i][2]);
 const pt=(i,f)=>{const a=(-90+72*i)*Math.PI/180;return[cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)]};
 const at=i=>{const a=(-90+72*i)*Math.PI/180;return[cx+LR*Math.cos(a),cy+LR*Math.sin(a)]};
 const poly=R5.map((_,i)=>pt(i,frac(i)).map(n=>n.toFixed(1)).join(',')).join(' ');
 return`<svg viewBox="0 0 400 320" role="img" aria-label="Radar chart of points by area" style="width:100%;max-width:460px;display:block;margin:auto">
 ${[.25,.5,.75,1].map(f=>`<polygon class="rg" points="${R5.map((_,i)=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`).join('')}
 ${R5.map((_,i)=>{const[x,y]=pt(i,1);return`<line class="rg" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}).join('')}
 <polygon class="rp" points="${poly}"/>
 ${R5.map((_,i)=>{const[x,y]=pt(i,frac(i));return`<circle class="rd" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`}).join('')}
 ${R5.map((_,i)=>{const[x,y]=at(i),an=x<cx-6?'end':x>cx+6?'start':'middle';return`<text class="rt" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${an}">${R5[i][1]}</text>`}).join('')}</svg>`}
function radarCard(by){
 return`<div class="card">
 <div class="row" style="justify-content:flex-end;gap:6px;margin:-4px 0 6px">
  <button class="chip ${RM==='cap'?'c3':'c1'}" onclick="RM='cap';draw()">Own cap</button>
  <button class="chip ${RM==='share'?'c3':'c1'}" onclick="RM='share';draw()">Share of total</button>
 </div>
 ${radar(by)}
 <p class="mut" style="text-align:center;margin-bottom:0">${RM==='cap'?'Each spoke is measured against its own realistic annual maximum, so every dimension can reach the rim. Talent bonus is folded into Skills.':'Each spoke shows that dimension’s share of the year’s total, so the five spokes add to 100%. Talent bonus is folded into Skills.'}</p></div>`;
}

 <div class="field"><label>School year of this file</label><select id="iy">${S.years.map(y=>`<option value="${y}" ${y===S.year?'selected':''}>${yl(y)}</option>`).join('')}</select></div>
 <div class="field"><label>Excel file (.xlsx)</label><input type="file" accept=".xlsx,.xls" onchange="readXlsx(this.files[0])"></div></div>
 `,exp:`<div class="card"><h2 style="margin-top:0">Export to Excel</h2><p class="mut">One file with three sheets: Scholars (all saved information), Points and Logs. The Scholars sheet can be imported again.</p><button class="btn" onclick="exportXlsx()">Download Excel</button></div>
 `,intake:`<div class="card"><h2 style="margin-top:0">Import scholar profile intake</h2><p class="mut">Reads the Jamovi template (Sheet1) by column name. Saves each scholar’s answers privately: only staff and the account linked to that scholar can read them. Open a scholar’s Profile tab to view them.</p><div class="field"><label>Intake file (.xlsx)</label><input type="file" accept=".xlsx,.xls" onchange="readIntake(this.files[0]);this.value=''"></div></div>
 `,year:`<div class="card"><h2 style="margin-top:0">School years</h2><p>Active: <b>${yl(S.year)}</b>. Scholars advance one grade each year; grades above 12 graduate and keep their points.</p><div class="field"><label>Switch year</label><select onchange="FB.setConfig({years:S.years,year:+this.value}).catch(fbErr)">${S.years.map(y=>`<option value="${y}" ${y===S.year?'selected':''}>${yl(y)}</option>`).join('')}</select></div><button class="btn" onclick="newYear()">Start ${yl(Math.max(...S.years)+1)}</button></div>`}}
function readIntake(f){if(!f)return;if(!window.XLSX){toast('The Excel library did not load. Check your connection and reload.');return}
 f.arrayBuffer().then(b=>{const wb=XLSX.read(b);let rows=null,H=null,hi=-1;
  for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true}),i=r.findIndex(x=>x.some(c=>norm(c)==='scholarid'));if(i>=0){rows=r;hi=i;break}}
  if(!rows){toast('No sheet with a Scholar_ID column was found.');return}
  H=rows[hi].map(norm);const col=n=>H.indexOf(norm(n)),names=[...rng(1,20).map(i=>'Epoch_'+i),...rng(1,17).map(i=>'CYRM_'+i),...rng(1,8).map(i=>'CES_A'+i),...rng(9,14).map(i=>'CES_B'+i)],miss=names.filter(n=>col(n)<0);
  if(miss.length){toast('Missing columns: '+miss.slice(0,4).join(', ')+(miss.length>4?'…':''));return}
  const items=[];let pend=0,part=0,bad=0,unk=0;
  const get=(r,n,mx)=>{const v=r[col(n)];if(v==null||String(v).trim()==='')return null;const x=Number(v);if(!Number.isInteger(x)||x<1||x>mx){bad++;return null}return x};
  const dt=v=>{if(typeof v==='number'){const p=XLSX.SSF.parse_date_code(v);return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:''}
   const m=String(v||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);return m?`${m[3].length===2?'20'+m[3]:m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`:''};
  const txt=(r,n)=>{const i=col(n);return i<0||r[i]==null?'':String(r[i]).trim()},num=(r,n)=>{const i=col(n),x=i<0?NaN:Number(r[i]);return Number.isFinite(x)?x:null};
  for(const r of rows.slice(hi+1)){const id=String(r[col('Scholar_ID')]||'').trim().toUpperCase();if(!/^S\d+$/.test(id))continue;
   const epoch=rng(1,20).map(i=>get(r,'Epoch_'+i,5)),cyrm=rng(1,17).map(i=>get(r,'CYRM_'+i,5)),cesA=rng(1,8).map(i=>get(r,'CES_A'+i,7)),cesB=rng(9,14).map(i=>get(r,'CES_B'+i,7)),n=[...epoch,...cyrm,...cesA,...cesB].filter(x=>x!=null).length;
   if(!n){pend++;continue}if(n<51)part++;if(!SC.find(s=>s.id===id))unk++;
   items.push({id,data:{grade:num(r,'Grade'),age:num(r,'Age'),sex:txt(r,'Sex'),type:txt(r,'Scholar_Type'),date:dt(r[col('Date')]),epoch,cyrm,cesA,cesB,importedAt:Date.now()}})}
  if(!items.length){toast('No completed profiles found in that file.');return}
  const msg=`Save ${items.length} scholar profiles?\n\n• ${pend} scholars have no answers yet and are skipped.\n• ${part} have unanswered items (scored on the items answered).`+(bad?`\n• ${bad} answers outside the allowed range were left blank.`:'')+(unk?`\n• ${unk} IDs are not in the scholars list.`:'')+`\n\nThis replaces any profile already saved for those IDs.`;
  if(!confirm(msg))return;
  FB.saveIntake(items).then(()=>toast(items.length+' profiles saved')).catch(fbErr)}).catch(e=>toast('Could not read that file: '+e.message))}
function newYear(){const y=Math.max(...S.years)+1;if(confirm(`Start ${yl(y)}? Every scholar advances one grade. All logs stay on record.`))FB.setConfig({years:[...S.years,y],year:y}).then(()=>toast(yl(y)+' started')).catch(fbErr)}
function readXlsx(f){if(!f)return;if(!window.XLSX){toast('The Excel library did not load. Check your connection and reload.');return}
 const yr0=+iy.value;f.arrayBuffer().then(b=>{const wb=XLSX.read(b);let rows=null;
  for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:false});if(r.length&&Object.keys(r[0]).some(h=>norm(h)==='lastname')){rows=r;break}}
  if(!rows){toast('No sheet with “Last Name” and “First Name” columns was found.');return}
  PEND=plan(rows,yr0);draw()}).catch(e=>toast('Could not read that file: '+e.message))}
function plan(rows,y){const byName={},fam={};let nid=Math.max(0,...SC.map(s=>+s.id.slice(1))),nh=Math.max(0,...SC.map(s=>+s.hh.slice(1)||0));
 SC.forEach(s=>{const i=INFO[s.id]||{};byName[norm(i.last)+norm(i.first)+norm(i.middle)]=s.id;fam[norm(i.last)+'|'+norm(i.barangay)]=s.hh});
 const items=[];let mis=0;
 for(const row of rows){const rec={},extra={};
  for(const[h,v]of Object.entries(row)){const val=String(v??'').trim();if(!val)continue;const k=HMAP[norm(h)];if(k)rec[k]=val;else if(norm(h)!=='no'&&norm(h)!=='')extra[h]=val}
  if(!rec.last&&!rec.first)continue;
  const nk=norm(rec.last)+norm(rec.first)+norm(rec.middle),fk=norm(rec.last)+'|'+norm(rec.barangay);
  const id=rec.id||byName[nk]||'S'+String(++nid).padStart(3,'0'),old=SC.find(s=>s.id===id);
  const hh=rec.hh||(old&&old.hh)||fam[fk]||'H'+String(++nh).padStart(2,'0');fam[fk]=fam[fk]||hh;byName[nk]=id;
  const gn=parseInt(String(rec.grade||'').replace(/\D/g,''))||null,info={};
  FLD.forEach(([k])=>{if(rec[k])info[k]=rec[k]});if(rec.parentSkills)info.parentSkills=rec.parentSkills;if(Object.keys(extra).length)info.extra=extra;
  const pub=old?{}:{hh,g0:+rec.g0||gn||7,y0:+rec.y0||y};if(old&&rec.hh)pub.hh=rec.hh;if(old&&rec.g0)pub.g0=+rec.g0;if(old&&rec.y0)pub.y0=+rec.y0;
  let changed=!old;if(old){const oi=INFO[id]||{};changed=Object.entries(info).some(([k,v])=>k==='extra'?JSON.stringify(v)!==JSON.stringify(oi.extra||{}):oi[k]!==v)||Object.keys(pub).length>0;if(gn&&gIn(old,y)!==gn)mis++}
  items.push({id,pub,info,isNew:!old,changed,name:`${rec.first||''} ${rec.last||''}`.trim(),grade:gn,hh})}
 return{items,mis,year:y}}
function pendV(){if(!PEND)return'';const n=PEND.items.filter(x=>x.isNew).length,u=PEND.items.filter(x=>!x.isNew&&x.changed).length,same=PEND.items.length-n-u;
 return`<h2>Review import</h2><div class="card"><p><b>${PEND.items.length}</b> scholars found: <span class="chip c4">${n} new</span> <span class="chip c3">${u} updated</span> <span class="chip c1">${same} unchanged</span>${PEND.mis?` <span class="chip w">${PEND.mis} grade${PEND.mis>1?'s':''} differ from the database</span>`:''}</p>
 ${PEND.mis?'<p class="mut">Grades in the database move forward with each school year, so the file’s grade is not used to change existing scholars. Fix any grade by editing the scholar.</p>':''}
 <div class="scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Grade</th><th>Household</th><th>Status</th></tr></thead><tbody>${PEND.items.slice(0,60).map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${x.grade||'—'}</td><td>${x.hh}</td><td>${x.isNew?'New':x.changed?'Updated':'Unchanged'}</td></tr>`).join('')}</tbody></table></div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="commitImport()">Save to database</button><button class="btn o" onclick="PEND=null;draw()">Cancel</button></div></div>`}
function commitImport(){const n=PEND.items.length;FB.saveScholars(PEND.items.filter(x=>x.changed)).then(()=>{PEND=null;toast(n+' scholars saved to the database');draw()}).catch(fbErr)}
function exportXlsx(){if(!window.XLSX){toast('The Excel library did not load. Reload and try again.');return}
 const sc=SC.map(s=>{const i=INFO[s.id]||{},o={'Scholar ID':s.id,'Household ID':s.hh,'Entry Year':s.y0,'Entry Grade':s.g0,'Grade Level':gIn(s,S.year)>12?'Graduated':'Grade '+gIn(s,S.year),'Barangay':i.barangay||'','Last Name':i.last||'','First Name':i.first||'','Middle Name':i.middle||'','Address':i.address||'','Gender':i.gender||'','Citizenship':i.citizenship||'','Religion':i.religion||'',"Father's Name":i.fatherName||'',"Father's Occupation":i.fatherJob||'',"Mother's Name":i.motherName||'',"Mother's Occupation":i.motherJob||'','E-mail Address':i.email||'','Contact Number':i.contact||'','Parent Skills':i.parentSkills||''};return Object.assign(o,i.extra||{})});
 const pts=SC.map(s=>{const t=calc(s),i=INFO[s.id]||{},o={'Scholar ID':s.id,Name:`${i.first||''} ${i.last||''}`.trim(),Grade:gIn(s,S.year),'Cumulative points':t.cum,'Counted total':t.gt,'Grant %':t.c[1]*100,'Grant (PHP)':t.c[2],'Project gate':t.held?'Held':t.p3?'Cleared':t.gate?'Pending':'N/A'};t.rows.forEach(r=>o[yl(r.y)]=f1(r.base+r.bonus));return o});
 const lg=S.logs.map(l=>({'Scholar ID':l.sid,Year:yl(l.y),Date:l.date,Area:AREAS[l.area],Activity:l.act,'Raw points':l.raw,Household:l.hh?'yes':'',Note:l.note||'',Voided:l.v?'yes':''}));
 const wb=XLSX.utils.book_new();[['Scholars',sc],['Points',pts],['Logs',lg]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),n));
 XLSX.writeFile(wb,`sweat-equity_${new Date().toISOString().slice(0,10)}.xlsx`)}
draw();

<script type="module">
