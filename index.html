<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sweat Equity Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:wght@300;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;--bg:#000;--s1:#15101c;--s2:#1f1830;--line:#352a4d;--p:#b388ff;--pc:#4a148c;--on:#ede7f6;--mut:#a99bc4;--warn:#ffd54f;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--on);font:400 15px/1.5 Roboto,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line);padding:12px 20px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font:800 22px/1 "Roboto Flex",Roboto,sans-serif;flex:1}
.yr{background:var(--pc);color:#fff;border-radius:16px;padding:4px 12px;font-weight:500;font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px;min-height:8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:500 14px Roboto;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--p);border-color:var(--p)}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #0008}
.card.hero{background:linear-gradient(135deg,var(--pc),#1a0933);border:0}
.big{font:800 44px/1 "Roboto Flex",Roboto,sans-serif;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font:500 18px Roboto;margin:24px 0 10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:500}tr.cl{cursor:pointer}tr.cl:hover{background:var(--s2)}.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--s2);color:var(--p);border:0;font-family:inherit}
.chip.c4{background:#1b5e20;color:#b9f6ca}.chip.c3{background:var(--pc);color:#fff}.chip.c2{background:#311b92;color:#d1c4e9}.chip.c1{background:#2a2140;color:var(--mut)}.chip.w{background:#4e3b00;color:var(--warn)}
button.chip{cursor:pointer;font-size:14px;padding:6px 14px;border-radius:16px}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;flex:1;min-width:160px}
label{font-size:12px;color:var(--mut)}
input,select{background:var(--s2);color:var(--on);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:2px solid var(--mut);padding:10px;font:inherit}
input:focus,select:focus{outline:0;border-bottom-color:var(--p)}
button.btn{background:var(--p);color:#1a0933;border:0;border-radius:20px;padding:10px 22px;font:500 14px Roboto;cursor:pointer;box-shadow:0 2px 6px #0009}
button.btn.o{background:none;color:var(--p);border:1px solid var(--line);box-shadow:none}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prev{background:var(--s2);border-left:4px solid var(--p);border-radius:8px;padding:12px;margin:12px 0}
.ladder{display:grid;gap:8px;margin-top:10px}.step{display:flex;justify-content:space-between;padding:8px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:14px}
.step.hit{background:var(--pc);border-color:var(--p)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#1a0933;border-radius:8px;padding:12px 20px;font-weight:500;z-index:9;max-width:90vw}
.scroll{overflow-x:auto}.err{color:var(--bad);min-height:20px;margin-top:8px}
.login{max-width:760px;margin:40px auto}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dt{color:var(--mut);font-size:13px}dd{margin:0;word-break:break-word}
.rg{fill:none;stroke:var(--line)}.rp{fill:#b388ff55;stroke:var(--p);stroke-width:2}.rd{fill:var(--p)}.rt{fill:var(--on);font:12px Roboto}.rv{fill:var(--mut);font:11px Roboto}
.tick{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;color:var(--p);font-weight:700;font-size:12px;line-height:1}
tr.on .tick{border-color:var(--p)}
@media(max-width:600px){main{padding:12px}.big{font-size:36px}}
</style></head><body>
<header><div class="bar"><h1>Sweat Equity Tracker</h1><span class="yr" id="yr"></span>
<label class="row" id="hl" hidden><input type="checkbox" id="hide" onchange="draw()" style="width:auto"> Hide names</label>
<button class="btn o" id="out" hidden onclick="FB.logout()">Sign out</button></div><nav id="nav"></nav></header>
<main id="main"></main>
<script>
const CAP={academic:999,community:75,leadership:90,skills:45,parental:50},REF={academic:340,community:75,leadership:90,skills:45,bonus:40,parental:50},AREAS={academic:'Academic',community:'Community',leadership:'Leadership',skills:'Skills',bonus:'Talent bonus',parental:'Parental'};
const TIERS={'Top (98–100)':100,'High Diligent (95–97.9)':80,'Diligent (90–94.9)':60,'Average (85–89.9)':40};
const ACT={academic:[['Report card tier','tier'],['Tutor',60],['Tutee',30],['Presentation',50],['Junior concept',20],['Project Phase 1',30],['Project Phase 2',30],['Project Phase 3 (clears gate)',20,'p3'],['Contest win bonus',20],['Publish bonus',30],['Ongoing business',50]],
community:[['Service instance',15],['Organized an event',25],['Mentoring (per mentee)',20]],leadership:[['Holding a position',40],['Leading a project',30],['Facilitating a workshop',20]],
skills:[['Internship',25],['Course',15],['Workshop',5],['Participation / training term',10]],bonus:[['Win',5],['Podium',2],['Representative selection',5],['Juried work',20]],parental:[['Volunteering',20],['Workshop',15],['Attended an event',10]]};
const LAD=[[800,1,30000],[600,.75,22500],[400,.5,15000],[200,.25,7500],[0,0,0]];
// Personal fields (database only). Parent skills is stored but never shown.
const FLD=[['last','Last name'],['first','First name'],['middle','Middle name'],['barangay','Barangay'],['address','Address'],['gender','Gender'],['citizenship','Citizenship'],['religion','Religion'],['fatherName',"Father's name"],['fatherJob',"Father's occupation"],['motherName',"Mother's name"],['motherJob',"Mother's occupation"],['email','Email'],['contact','Contact number']];
const HMAP={scholarid:'id',id:'id',householdid:'hh',household:'hh',entrygrade:'g0',entryyear:'y0',gradelevel:'grade',grade:'grade',lastname:'last',firstname:'first',middlename:'middle',barangay:'barangay',address:'address',gender:'gender',citizenship:'citizenship',religion:'religion',fathersname:'fatherName',fathersoccupation:'fatherJob',mothersname:'motherName',mothersoccupation:'motherJob',emailaddress:'email',email:'email',contactnumber:'contact',contact:'contact',parentskills:'parentSkills'};
let ME=null,SC=[],INFO={},S={years:[2026],year:2026,logs:[]},tab='scholars',sel=null,q='',editing=false,PEND=null,RM='cap',F={a:'academic',i:0,raw:100,id:null,date:'',note:''},W={add:0,p3:false,pts:450,g:7};
const isA=()=>ME==='admin',peso=n=>'₱'+n.toLocaleString('en-PH'),P=n=>isA()?peso(n):'',wt=g=>g<=8?.75:1,cem=p=>LAD.find(r=>p>=r[0]),f1=n=>Math.round(n*100)/100;
const today=()=>new Date().toISOString().slice(0,10);
const gIn=(s,y)=>s.g0+(y-s.y0),yl=y=>`SY${y}-${y+1}`,rate=c=>c[1]*100+'%'+(isA()?' · '+peso(c[2]):''),norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=s=>{const i=INFO[s.id];return isA()&&!hide.checked&&i&&(i.first||i.last)?`${i.first||''} ${i.last||''}`.trim():''};
const gl=s=>{const g=gIn(s,S.year);return g>12?'Grad':'G'+g};
const lab=s=>[s.id,nm(s),gl(s)].filter(Boolean).join(' · ');
const authMsg=e=>({'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'Enter a valid email.','auth/admin-restricted-operation':'Viewer sign-in is turned off. In Firebase, open Authentication → Sign-in method and enable Anonymous.','auth/operation-not-allowed':'This sign-in method is off. Enable it in Firebase Authentication → Sign-in method.','auth/unauthorized-domain':'Add this site’s domain under Authentication → Settings → Authorized domains.','auth/too-many-requests':'Too many tries. Wait a few minutes.'}[e.code]||e.message);
const fbErr=e=>toast(e.code==='permission-denied'?'Not allowed. Only the admin can do that.':e.message);
function setMe(r){ME=r;if(!r){S.logs=[];SC=[];INFO={};sel=null;PEND=null}else tab=r==='admin'?'dash':'scholars';draw()}
function calc(s,extra){
 const lg=extra&&extra.length?S.logs.concat(extra):S.logs;
 let base=0,bon=0,rows=[],byAll={};
 for(const y of S.years){const g=gIn(s,y);if(g>12||g<7)continue;const w=wt(g),by={};
  lg.filter(l=>l.sid===s.id&&l.y===y&&!l.v).forEach(l=>by[l.area]=(by[l.area]||0)+l.raw);
  let cp=0;for(const a in CAP){const v=Math.min(by[a]||0,CAP[a]);cp+=v;byAll[a]=(byAll[a]||0)+v*w}
  const b=Math.min(by.bonus||0,40);byAll.bonus=(byAll.bonus||0)+b*w;
  rows.push({y,g,w,by,base:cp*w,bonus:b*w});base+=cp*w;bon+=b*w}
 const bc=Math.min(bon,120),cum=f1(base+bc),p3=lg.some(l=>l.sid===s.id&&l.p3&&!l.v),gate=s.g0<=8,held=gate&&!p3&&cum>=800,gt=held?799:cum;
 return{rows,cum,gt,p3,gate,held,bc,c:cem(gt),byAll}
}
const cc=c=>c>=1?'c4':c>=.75?'c3':c>=.5?'c2':c>0?'c1':'';
const all=()=>SC.map(s=>({s,t:calc(s)}));
function pick(id){sel=id||null;editing=false;W.add=0;const s=SC.find(x=>x.id===id);W.p3=s?calc(s).p3:false;if(id)F.id=id;draw()}
function draw(){yr.textContent=yl(S.year);out.hidden=!ME;hl.hidden=!isA();
 if(!ME){nav.innerHTML='';main.innerHTML=loginV();return}
 const T=isA()?{dash:'Dashboard',scholars:'Scholars',calc:'Calculator',award:'Award points',data:'Data & years'}:{scholars:'Scholars',calc:'Calculator'};
 if(!T[tab])tab='scholars';
 nav.innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';draw()">${v}</button>`).join('');
 main.innerHTML=({dash,scholars:scholarsTab,calc:calcTab,award,data})[tab]();
 if(tab==='award')prev()}
function loginV(){return`<div class="login grid"><div class="card"><h2 style="margin-top:0">Admin</h2><p class="mut">Full access with your password.</p>
 <div class="field"><label>Email</label><input id="lem" type="email" value="admin@lla.edu" autocomplete="username"></div><div class="field"><label>Password</label><input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdmin()"></div>
 <button class="btn" onclick="doAdmin()">Sign in</button></div>
 <div class="card"><h2 style="margin-top:0">Viewer</h2><p class="mut">No password. Look up a scholar by ID to see points and grant rate. Names are not shown.</p><button class="btn o" onclick="doViewer()">Continue as viewer</button></div></div><div class="err" id="err" style="text-align:center"></div>`}
function doAdmin(){err.textContent='';FB.login(lem.value.trim(),lpw.value).catch(e=>err.textContent=authMsg(e))}
function doViewer(){err.textContent='';FB.viewer().catch(e=>err.textContent=authMsg(e))}
const empty=()=>`<div class="card">${isA()?'No scholars in the database yet. Open <b>Data & years</b> and import your scholars Excel file.':'No scholar data yet. Ask the admin to load it.'}</div>`;
function dash(){if(!SC.length)return empty();const a=all().sort((x,y)=>y.t.gt-x.t.gt),tot=a.reduce((n,x)=>n+x.t.cum,0),t100=a.filter(x=>x.t.c[1]>=1).length,held=a.filter(x=>x.t.held).length,pay=a.reduce((n,x)=>n+x.t.c[2],0),hh=new Set(SC.map(s=>s.hh)).size,lo=SC.filter(s=>gIn(s,S.year)<=8).length;
 return`<div class="grid"><div class="card hero"><div class="mut" style="color:#d1c4e9">Cumulative points awarded</div><div class="big">${f1(tot).toLocaleString()}</div></div>
 <div class="card"><div class="mut">Scholars · households</div><div class="big">${SC.length} · ${hh}</div></div>
 <div class="card"><div class="mut">At 100% grant</div><div class="big">${t100}</div></div>
 <div class="card"><div class="mut">Held by project gate</div><div class="big">${held}</div></div>
 <div class="card"><div class="mut">Grant value at current points</div><div class="big" style="font-size:30px">${peso(pay)}</div></div></div>
 <div class="card" style="margin-top:14px"><b>Grades 7–8 carry a ×0.75 weight.</b> <span class="mut">${lo} of ${SC.length} scholars are in these grades this year, so their totals run lower than their raw points. That is the program rule, not a bug.</span></div>
 <h2>Leaderboard</h2><div class="card scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Grade</th><th class="num">Cumulative</th><th>Grant</th></tr></thead><tbody>
 ${a.map(({s,t})=>{const g=gIn(s,S.year);return`<tr class="cl" onclick="tab='scholars';pick('${s.id}')"><td>${s.id}</td><td>${esc(nm(s))||'—'}</td><td>${g>12?'Graduated':g+` (×${wt(g)})`}</td><td class="num">${t.gt}${t.held?' <span class="chip w">gate</span>':''}</td><td><span class="chip ${cc(t.c[1])}">${rate(t.c)}</span></td></tr>`}).join('')}</tbody></table></div>`}
/* ---- Radar: 5 spokes, Talent bonus folded into Skills ---- */
const R5=[['academic','Academic',340],['skills','Skills + bonus',85],['leadership','Leadership',90],['community','Community',75],['parental','Parental',50]];
function radar(by){
 const cx=200,cy=160,R=90,LR=113;
 const vals=R5.map(([k])=>k==='skills'?Math.min(by.skills||0,CAP.skills)+Math.min(by.bonus||0,40):Math.min(by[k]||0,CAP[k]));
 const tot=vals.reduce((a,b)=>a+b,0);
 const frac=i=>RM==='share'?(tot?vals[i]/tot:0):Math.min(1,vals[i]/R5[i][2]);
 const pt=(i,f)=>{const a=(-90+72*i)*Math.PI/180;return[cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)]};
 const at=i=>{const a=(-90+72*i)*Math.PI/180;return[cx+LR*Math.cos(a),cy+LR*Math.sin(a)]};
 const poly=R5.map((_,i)=>pt(i,frac(i)).map(n=>n.toFixed(1)).join(',')).join(' ');
 return`<svg viewBox="0 0 400 320" role="img" aria-label="Radar chart of points by area" style="width:100%;max-width:460px;display:block;margin:auto">
 ${[.25,.5,.75,1].map(f=>`<polygon class="rg" points="${R5.map((_,i)=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`).join('')}
 ${R5.map((_,i)=>{const[x,y]=pt(i,1);return`<line class="rg" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}).join('')}
 <polygon class="rp" points="${poly}"/>
 ${R5.map((_,i)=>{const[x,y]=pt(i,frac(i));return`<circle class="rd" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`}).join('')}
 ${R5.map((_,i)=>{const[x,y]=at(i),an=x<cx-6?'end':x>cx+6?'start':'middle';return`<text class="rt" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${an}">${R5[i][1]}</text>`}).join('')}</svg>`}
function radarCard(by){
 return`<div class="card">
 <div class="row" style="justify-content:flex-end;gap:6px;margin:-4px 0 6px">
  <button class="chip ${RM==='cap'?'c3':'c1'}" onclick="RM='cap';draw()">Own cap</button>
  <button class="chip ${RM==='share'?'c3':'c1'}" onclick="RM='share';draw()">Share of total</button>
 </div>
 ${radar(by)}
 <p class="mut" style="text-align:center;margin-bottom:0">${RM==='cap'?'Each spoke is measured against its own realistic annual maximum, so every dimension can reach the rim. Talent bonus is folded into Skills.':'Each spoke shows that dimension’s share of the year’s total, so the five spokes add to 100%. Talent bonus is folded into Skills.'}</p></div>`;
}
function resH(){const s=SC.find(x=>x.id===sel),t=s&&calc(s),base=s?t.cum:W.pts,gate=(s?s.g0:W.g)<=8,pts=f1(base+W.add),held=gate&&!W.p3&&pts>=800,gt=held?799:pts,c=cem(gt),nx=LAD.slice().reverse().find(r=>r[0]>gt);
 return`<div class="mut">Grant at ${gt} points</div><div class="big">${c[1]*100}%</div>${isA()?`<div style="font-size:22px">${peso(c[2])}</div>`:''}${s&&(W.add>0||W.p3!==t.p3)?`<div class="mut">Now: ${rate(t.c)}</div>`:''}
 <p>${held?'The project gate holds this scholar at 799. Completing Phase 3 releases the 100% grant.':nx?`${f1(nx[0]-gt)} more points reach ${nx[1]*100}%${isA()?' ('+peso(nx[2])+')':''}.`:'Top tier reached.'}</p>
 <div class="ladder">${LAD.map(r=>`<div class="step ${r===c?'hit':''}"><span>${r[0]}${r[0]===800?'+':'–'+(r[0]===0?199:r[0]+199)} points</span><span>${r[1]*100}%${isA()?' · '+peso(r[2]):''}</span></div>`).join('')}</div><p class="mut">A step function: 799 points earns 75%, 800 earns 100%.</p>`}
// Searchable checklist picker
const searchList=()=>{const m=q.trim().toLowerCase();return SC.filter(x=>!m||x.id.toLowerCase().includes(m)||(nm(x)||'').toLowerCase().includes(m)||gl(x).toLowerCase().includes(m))};
function pickerRows(list){
 if(!list.length)return`<p class="mut" style="margin:0;padding:8px">${q?`No scholar matches “${esc(q)}”.`:'No scholars loaded.'}</p>`;
 const shown=list.slice(0,80);
 return`<table><tbody>${shown.map(x=>{const on=x.id===sel,t=calc(x);return`<tr class="cl ${on?'on':''}" onclick="pick('${x.id}')" style="${on?'background:var(--s2)':''}">
 <td style="width:32px"><span class="tick">${on?'✓':''}</span></td>
 <td><b>${x.id}</b>${nm(x)?' · '+esc(nm(x)):''}</td>
 <td>${gl(x)}</td>
 <td class="num"><span class="chip ${cc(t.c[1])}">${t.gt} · ${t.c[1]*100}%</span></td>
 </tr>`}).join('')}</tbody></table>${list.length>80?`<p class="mut" style="padding:8px;margin:0">Showing 80 of ${list.length}. Type more to narrow.</p>`:''}`;
}
function refreshPicker(){const e=document.getElementById('plist');if(e)e.innerHTML=pickerRows(searchList())}
function pickerV(kind){
 const sel0=SC.find(x=>x.id===sel);
 return`<div class="card" style="padding:14px">
 <div class="row" style="align-items:flex-end">
  <div class="field" style="margin:0;flex:1;min-width:200px"><label>Search &amp; tick a scholar</label>
   <input value="${esc(q)}" placeholder="Type an ID${isA()?' or name':''}…" oninput="q=this.value;refreshPicker()"></div>
  ${kind==='scholars'&&isA()?`<button class="btn o" onclick="newScholar()">Add scholar</button>`:''}
  ${kind==='calc'&&isA()?`<button class="btn o" onclick="pick('')">Manual what-if</button>`:''}
 </div>
 ${sel0?`<p class="mut" style="margin:8px 0 0">Selected <span class="chip c3">${esc(lab(sel0))}</span></p>`:''}
 <div class="scroll" id="plist" style="max-height:260px;margin-top:8px">${pickerRows(searchList())}</div>
 </div>`;
}
function scholarsTab(){
 if(!SC.length)return empty();
 const s=SC.find(x=>x.id===sel),t=s&&calc(s),top=pickerV('scholars');
 if(!s)return top+`<div class="card mut" style="margin-top:14px">${isA()?'Tick a scholar above to open their record.':'Tick a scholar above to see points and grant rate.'}</div>`;
 const g=gIn(s,S.year),r=t.rows.find(x=>x.y===S.year),by=r?r.by:{},logs=S.logs.filter(l=>l.sid===s.id&&l.y===S.year).slice().sort((a,b)=>(b.date||'')>(a.date||'')?1:-1);
 const hero=`<div class="card hero"><div class="mut" style="color:#d1c4e9">${s.id}${nm(s)?' · '+esc(nm(s)):''}${isA()?' · '+s.hh:''}</div><div class="big">${t.gt}<span style="font-size:20px">/800</span></div><div>${g>12?'Graduated':'Grade '+g+' (×'+wt(g)+')'} · entered at Grade ${s.g0} in ${yl(s.y0)}</div>
 <div style="margin-top:10px"><span class="chip ${t.held?'w':'c4'}">${!t.gate?'Gate not applicable (entry Grade 9+)':t.p3?'Gate cleared · Phase 3 on record':t.held?'Held at 799 · needs Phase 3':'Needs Phase 3 before 800'}</span></div></div>`;
 return top+`<div class="grid" style="margin-top:14px">${hero}</div>`+cumCard(t)
